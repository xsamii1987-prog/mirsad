  $("#btnBrowse").addEventListener("click",e=>{e.stopPropagation();input.click();});
  input.addEventListener("change",e=>{const f=e.target.files[0];if(f)handleFile(f);});
}


/* ===========================================================================
   LAYER 15 — SHARE BY LINK
   The dataset is deflated and base64url-encoded into the URL fragment. A
   fragment never leaves the browser — it is not sent to the host — so the link
   works on any static hosting without a server or database behind it.
   =========================================================================== */
const b64u={
  enc(u8){ let s="",CH=0x8000;
    for(let i=0;i<u8.length;i+=CH) s+=String.fromCharCode.apply(null,u8.subarray(i,i+CH));
    return btoa(s).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,""); },
  dec(str){ const s=atob(str.replace(/-/g,"+").replace(/_/g,"/"));
    const u8=new Uint8Array(s.length); for(let i=0;i<s.length;i++) u8[i]=s.charCodeAt(i); return u8; }
};
const Share={
  async pack(records){
    const bytes=new TextEncoder().encode(JSON.stringify(records));
    if(typeof CompressionStream==="function"){
      const cs=new CompressionStream("deflate-raw");
      const out=new Uint8Array(await new Response(new Blob([bytes]).stream().pipeThrough(cs)).arrayBuffer());
      return "z"+b64u.enc(out);
    }
    return "r"+b64u.enc(bytes);
  },
  async unpack(str){
    const data=b64u.dec(str.slice(1));
    const bytes= str[0]==="z" ? await Zip.inflate(data) : data;
    return JSON.parse(new TextDecoder().decode(bytes));
  },
  async link(records){
    return location.href.split("#")[0]+"#d="+await Share.pack(records);
  },
  async read(){
    const m=/[#&]d=([^&]+)/.exec(location.hash||"");
    if(!m) return null;
    try{ const r=await Share.unpack(decodeURIComponent(m[1])); return Array.isArray(r)&&r.length?r:null; }
    catch(e){ return null; }
  },
  isLocal(){ return location.protocol==="file:"; }
};

async function sendNotes(){

/* --- 0. ephemeral mode ------------------------------------------------------
   On a borrowed or shared machine the safest storage is none at all. */
const Session={
  KEY:"sanad.ephemeral",
  get on(){ try{ return localStorage.getItem(this.KEY)==="1"; }catch(e){ return false; } },
  set(v){ try{ v?localStorage.setItem(this.KEY,"1"):localStorage.removeItem(this.KEY); }catch(e){} }
};

/* --- A. live link to a spreadsheet ----------------------------------------- */
/* IndexedDB is unavailable on some local-file setups. Every call here is
   best-effort: remembering the handle is a convenience, never a precondition
   for linking a file. */
const IDB={
  open(){ return new Promise((res,rej)=>{
    try{
      const r=indexedDB.open("sanad",1);
      r.onupgradeneeded=()=>r.result.createObjectStore("kv");
      r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error);
    }catch(e){ rej(e); } }); },
  async set(k,v){ try{
    const db=await this.open(); return await new Promise(res=>{
      const tx=db.transaction("kv","readwrite"); tx.objectStore("kv").put(v,k);
      tx.oncomplete=()=>res(true); tx.onerror=()=>res(false); });
  }catch(e){ return false; } },
  async get(k){ try{ const db=await this.open(); return await new Promise(res=>{
    const tx=db.transaction("kv","readonly"); const q=tx.objectStore("kv").get(k);
    q.onsuccess=()=>res(q.result); q.onerror=()=>res(null); }); }catch(e){ return null; } },
  async del(k){ try{ const db=await this.open(); const tx=db.transaction("kv","readwrite"); tx.objectStore("kv").delete(k); }catch(e){} }
};

const LiveFile={
  handle:null, name:"", last:0, timer:null,
  supported(){ return typeof window!=="undefined" && typeof window.showOpenFilePicker==="function"; },
  async pick(){
    const [h]=await window.showOpenFilePicker({multiple:false,types:[{description:"Excel / CSV",
      accept:{"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet":[".xlsx"],"text/csv":[".csv",".txt"]}}]});
    this.handle=h; this.name=h.name;
    await this.load();            /* do the useful work before anything optional */
    this.watch();
    IDB.set("liveFile",h).catch(()=>{});
    try{ localStorage.setItem("sanad.liveName",h.name); }catch(e){}
  },
  async restore(){
    const h=await IDB.get("liveFile"); if(!h||typeof h.queryPermission!=="function") return false;
    const perm=await h.queryPermission({mode:"read"});
    if(perm!=="granted"){ this.handle=h; this.name=h.name; return "needs-permission"; }
    this.handle=h; this.name=h.name; await this.load(); this.watch(); return true;
  },
  async grant(){
    if(!this.handle) return false;
    const p=await this.handle.requestPermission({mode:"read"});
    if(p!=="granted") return false;
    await this.load(); this.watch(); return true;
  },
  async load(){
    if(!this.handle) return;
    const file=await this.handle.getFile();
    this.last=file.lastModified;
    const report=await fileToRecords(file);
    DataLayer.apply(report.records);
    if(typeof render==="function") render();
    toast("low",t("lf.updated").replace("{n}",nf(report.records.length)));
  },
  watch(){
    clearInterval(this.timer);
    this.timer=setInterval(async()=>{
      if(!this.handle||document.hidden) return;
      try{
        const f=await this.handle.getFile();
        if(f.lastModified!==this.last) await this.load();
      }catch(e){ clearInterval(this.timer); toast("high",t("lf.fail")); }
    },5000);
  },
  unlink(){ clearInterval(this.timer); this.handle=null; this.name=""; this.last=0;
    IDB.del("liveFile"); try{localStorage.removeItem("sanad.liveName");}catch(e){} }
};

/* --- B. passphrase vault ---------------------------------------------------- */
const Vault={
  KEY:"sanad.vault", key:null, salt:null, active:false,
  exists(){ try{ return !!localStorage.getItem(this.KEY); }catch(e){ return false; } },
  async derive(pass,salt){
    const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(pass),"PBKDF2",false,["deriveKey"]);
    return crypto.subtle.deriveKey({name:"PBKDF2",salt,iterations:200000,hash:"SHA-256"},
      base,{name:"AES-GCM",length:256},false,["encrypt","decrypt"]);
  },
  async enable(pass){
    this.salt=crypto.getRandomValues(new Uint8Array(16));
    this.key=await this.derive(pass,this.salt);
    this.active=true;
    await this.save(DataLayer.raw());
    Store.clear();
  },
  async save(records){
    if(!this.active||!this.key) return;
    const iv=crypto.getRandomValues(new Uint8Array(12));
    const ct=new Uint8Array(await crypto.subtle.encrypt({name:"AES-GCM",iv},this.key,
      new TextEncoder().encode(JSON.stringify(records))));
    try{ localStorage.setItem(this.KEY,JSON.stringify({v:1,salt:b64u.enc(this.salt),iv:b64u.enc(iv),ct:b64u.enc(ct)})); }catch(e){}
  },
  async unlock(pass){
    const blob=JSON.parse(localStorage.getItem(this.KEY));
    const salt=b64u.dec(blob.salt), iv=b64u.dec(blob.iv), ct=b64u.dec(blob.ct);
    const key=await this.derive(pass,salt);
    const plain=await crypto.subtle.decrypt({name:"AES-GCM",iv},key,ct); /* throws on a wrong passphrase */
    this.key=key; this.salt=salt; this.active=true;
    return JSON.parse(new TextDecoder().decode(plain));
  },
  disable(){
    const records=DataLayer.raw();
    try{ localStorage.removeItem(this.KEY); }catch(e){}
    this.key=null; this.salt=null; this.active=false;
    if(DataLayer.source==="imported") Store.save(records);
  }
};

/* Full-screen gate shown at start-up when a vault exists. */
function showLock(){
  return new Promise(resolve=>{
    const el=document.createElement("div");
    el.id="lockGate";
    el.style.cssText="position:fixed;inset:0;z-index:180;display:grid;place-items:center;background:var(--bg);padding:20px";
    el.innerHTML=`
      <div style="width:min(360px,100%);text-align:center">
        <svg width="46" height="46" viewBox="0 0 24 24" fill="none" stroke="var(--brass)" stroke-width="1.5" style="margin:0 auto 14px">
          <rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>
        <h2 style="font-size:16px">${esc(t("vt.locked"))}</h2>
        <p style="font-size:12.5px;color:var(--tx-3);margin-top:5px">${esc(t("vt.enter"))}</p>
        <input type="password" id="lockPass" autocomplete="current-password"
          style="width:100%;margin-top:16px;text-align:center" placeholder="${esc(t("vt.pass"))}">
        <p id="lockErr" style="font-size:12px;color:var(--sev-crit);margin-top:8px;min-height:16px"></p>
        <button class="btn primary" id="lockGo" style="width:100%;justify-content:center">${esc(t("vt.unlock"))}</button>
        <button class="btn" id="lockSkip" style="width:100%;justify-content:center;margin-top:8px">${esc(t("vt.skip"))}</button>
      </div>`;
    document.body.appendChild(el);
    const pass=el.querySelector("#lockPass"), err=el.querySelector("#lockErr");
    setTimeout(()=>pass.focus(),120);
    /* Resolves with the decrypted records, or null when the reader skips the
       gate. Boot applies them after the data layer has finished loading, so
       nothing can overwrite an unlocked dataset. */
    const done=v=>{ el.remove(); resolve(v||null); };
    const tryUnlock=async()=>{
      err.textContent="";
      try{ done(await Vault.unlock(pass.value)); }
      catch(e){ err.textContent=t("vt.wrong"); pass.value=""; pass.focus(); }
    };
    el.querySelector("#lockGo").addEventListener("click",tryUnlock);
    pass.addEventListener("keydown",e=>{ if(e.key==="Enter") tryUnlock(); });
    el.querySelector("#lockSkip").addEventListener("click",()=>done(null));
  });
}

async function sha256hex(text){
  const b=new Uint8Array(await crypto.subtle.digest("SHA-256",new TextEncoder().encode(text)));
  return [...b].map(x=>x.toString(16).padStart(2,"0")).join("");
}

const ROUTES={
  dashboard:viewDashboard, map:viewMap, matrix:viewMatrix, events:viewEvents,
  countries:viewCountries, ai:viewAI, forecast:viewForecast, simulator:viewSimulator,
  reports:viewReports, alerts:()=>viewAlerts(), watchlist:()=>viewWatchlist(),

/* --- selection pipeline: search → category → sort --------------------------- */
function currentList(){
  let l=DataLayer.all().slice();
  if(State.q){
    const q=State.q.toLowerCase();
    l=l.filter(x=>[L(x).n,L(x).cty,x.id,t("cat."+x.cat),L(x).d].join(" ").toLowerCase().includes(q));
  }
  if(State.cat!=="all") l=l.filter(x=>x.cat===State.cat);
  const key=State.sortKey;
  const val=x=>({name:L(x).n,cty:L(x).cty,cat:t("cat."+x.cat),score:x.score,p:x.p,i:x.i,c:x.c,upd:-x.upd,st:x.st}[key]);
  l.sort((a,b)=>{const A=val(a),B=val(b);
    return (typeof A==="string"?A.localeCompare(B,LANG):A-B)*State.sortDir;});
  return l;
}

function render(){
  if(ACCESS.viewer&&(State.route==="data"||State.route==="settings"&&false)) State.route="dashboard";
  const list=currentList();
  const host=$("#v-"+State.route);
  if(!host) return;
  host.innerHTML=ROUTES[State.route](list);
  $$(".view").forEach(v=>v.classList.toggle("on",v.id==="v-"+State.route));
  $$(".nav-btn").forEach(b=>b.setAttribute("aria-current",b.dataset.route===State.route?"page":"false"));
  animateCounters(host);
  if(State.route==="simulator") wireSimulator();
  if(State.route==="data") wireData();
  if(State.route==="settings") wireSecurity();
  if(State.route==="dashboard"||State.route==="map") wireMap();
  $("#main").scrollTop=0;
  refreshChrome();
}

function animateCounters(root){
  $$("[data-count]",root).forEach(el=>{
    const target=+el.dataset.count;
    if(matchMedia("(prefers-reduced-motion:reduce)").matches){el.textContent=nf(target);return;}
    const t0=performance.now(),dur=750;
    const step=now=>{const p=Math.min(1,(now-t0)/dur);
      el.textContent=nf(Math.round(target*(1-Math.pow(1-p,3))));
      if(p<1) requestAnimationFrame(step);};
    requestAnimationFrame(step);
  });
}

function wireSimulator(){
  const pick=$("#simPick"); if(!pick) return;
  const read=()=>({x:DataLayer.byId(pick.value),sev:+$("#simSev").value,dur:+$("#simDur").value,resp:+$("#simResp").value});
  ["simSev","simDur","simResp"].forEach(id=>{
    const el=$("#"+id); el.addEventListener("input",()=>{ $("#"+id+"V").textContent=el.value; });
  });
  pick.addEventListener("change",()=>{State.sim=pick.value;render();});
  $("#simReset").addEventListener("click",()=>{State.simSev=State.simDur=State.simResp=null;render();});
  $("#simRun").addEventListener("click",()=>{
    const {x,sev,dur,resp}=read();
    State.sim=x.id;State.simSev=sev;State.simDur=dur;State.simResp=resp;
    const out=simulate(x,sev,dur,resp);
    const worst=out.slice().sort((a,b)=>b.v-a.v)[0];
    $("#simOut").innerHTML=`
      <div style="font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--brass);margin-bottom:10px">${esc(t("sim.out"))}</div>
      ${Chart.bars(out.map(o=>({l:o.l,v:o.v,c:Risk.colour(o.v)})),{horizontal:true})}
      <p style="margin-top:12px;font-size:12.5px;color:var(--tx-2)">${LANG==="ar"
        ?`عند شدة ${sev} ولمدة ${dur} أسبوعاً وبجاهزية استجابة ${resp}%، يقع الضغط الأكبر على ${worst.l} بمستوى ${worst.v}. رفع الجاهزية عشر نقاط يخفض الأثر بنحو ${Math.round(worst.v*0.045)} نقاط.`
        :`At severity ${sev} over ${dur} weeks with ${resp}% readiness, the heaviest pressure falls on ${worst.l} at ${worst.v}. Each 10 points of readiness removes roughly ${Math.round(worst.v*0.045)} points of impact.`}</p>`;
    animateCounters($("#simOut"));
  });
  $("#simRun").click();
}

/* --- map tooltip ----------------------------------------------------------- */
function wireMap(){
  const box=$("#mapbox"); if(!box) return;
  const tip=$("#maptip",box);
  box.addEventListener("mousemove",e=>{
    const n=e.target.closest(".node");
    if(!n){tip.classList.remove("on");return;}
    const r=box.getBoundingClientRect();
    tip.innerHTML=`<b>${esc(n.dataset.name)}</b><br><span style="color:var(--tx-3)">${esc(n.dataset.cty)}</span> · <b class="num">${n.dataset.score}</b>`;
    tip.classList.add("on");
    const x=e.clientX-r.left, y=e.clientY-r.top;
    tip.style.left=Math.min(x+14,r.width-240)+"px";
    tip.style.top=Math.max(y-46,6)+"px";
  });
  box.addEventListener("mouseleave",()=>tip.classList.remove("on"));
}

/* --- language & theme ------------------------------------------------------ */
function applyLang(){
  document.documentElement.dataset.mode=ACCESS.viewer?"viewer":"editor";
  const mk=$("#copyMark");
  if(mk){ mk.textContent=ACCESS.copyMark||""; mk.hidden=!ACCESS.copyMark; }
  document.documentElement.lang=LANG;
  document.documentElement.dir=LANG==="ar"?"rtl":"ltr";
  $("#langLbl").textContent=LANG==="ar"?"EN":"ع";
  $$("[data-i18n]").forEach(el=>el.textContent=t(el.dataset.i18n));
  $$("[data-i18n-ph]").forEach(el=>el.placeholder=t(el.dataset.i18nPh));
  if(typeof paintFab==="function") paintFab();
  const b=L(BRAND);
  $$("[data-i18n='app.name']").forEach(el=>el.textContent=b.name);
  $$("[data-i18n='app.tagline']").forEach(el=>el.textContent=b.tagline);
  document.title=b.name+" · "+b.tagline;
  localStorage.setItem("sanad.lang",LANG);
}
function setTheme(mode){
  document.documentElement.dataset.theme=mode;
  if(typeof paintWatermark==="function") paintWatermark();
  localStorage.setItem("sanad.theme",mode);
  $("#themeIcon").innerHTML=mode==="dark"
    ? '<path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8"/>'
    : '<circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M19.1 4.9l-1.4 1.4M6.3 17.7l-1.4 1.4"/>';
}

/* --- global event delegation ----------------------------------------------- */
document.addEventListener("click",e=>{
  const nav=e.target.closest(".nav-btn");
  if(nav){State.route=nav.dataset.route;render();if(innerWidth<900)$("#nav").classList.remove("open");return;}

  const go=e.target.closest("[data-route-to]");
  if(go){State.route=go.dataset.routeTo;render();return;}

  const open=e.target.closest("[data-open]");
  if(open){openThreat(open.dataset.open);return;}

  const sim=e.target.closest("[data-sim]");
  if(sim){State.sim=sim.dataset.sim;State.route="simulator";closeDrawer();render();return;}

  const cat=e.target.closest("[data-cat]");
  if(cat){State.cat=cat.dataset.cat;render();return;}

  const th=e.target.closest("th[data-sort]");
  if(th){const k=th.dataset.sort;if(k==="act")return;
    if(State.sortKey===k)State.sortDir*=-1;else{State.sortKey=k;State.sortDir=-1;}
    render();return;}

  const ack=e.target.closest("[data-ack]");
  if(ack){const row=ack.closest("[data-alert]");row.style.opacity=".4";ack.disabled=true;return;}

  const sl=e.target.closest("[data-setlang]");
  if(sl){LANG=sl.dataset.setlang;applyLang();render();return;}

  const st=e.target.closest("[data-settheme]");
  if(st){setTheme(st.dataset.settheme);render();return;}

  if(e.target.closest("#btnExport")||e.target.closest("#btnExport2")){exportCSV();return;}
  if(e.target.closest("#btnTplX")){downloadTemplateXlsx();return;}
  if(e.target.closest("#btnTplC")){exportDataCsv(templateRows(),"sanad-template.csv");return;}
  if(e.target.closest("#btnExpX")){exportDataXlsx();return;}
  if(e.target.closest("#btnExpC")){exportDataCsv(recordsToRows(DataLayer.all()),"sanad-data.csv");return;}
  if(e.target.closest("#btnKeepShared")){
    DataLayer.apply(DataLayer.raw()); render();
    toast("low",LANG==="ar"?"حُفظت نسخة في هذا المتصفح":"A copy is now saved in this browser"); return;}
  if(e.target.closest("#btnResetData")){
    if(location.hash) history.replaceState(null,"",location.href.split("#")[0]);
    DataLayer.resetDemo(); State.sim=null; render();
    toast("low",LANG==="ar"?"عادت اللوحة إلى بيانات العرض":"Back to the demo dataset"); return;}
  if(e.target.closest("#btnApplyImport")){
    if(lastReport){ DataLayer.apply(lastReport.records);
      const n=lastReport.records.length; lastReport=null; State.sim=null; State.q=""; State.cat="all";
      $("#globalSearch").value=""; State.route="dashboard"; render();
      toast("low",t("dt.done").replace("{n}",nf(n))); }
    return;}
  if(e.target.closest("#btnCancelImport")){ lastReport=null; $("#importReport").innerHTML=""; return;}
  if(e.target.closest("#btnPrint")){window.print();return;}
  if(e.target.closest("#btnAckAll")){$$("#alertList .ins").forEach(r=>r.style.opacity=".4");return;}
  if(e.target.closest("#swLive")){State.live=!State.live;$("#swLive").classList.toggle("on",State.live);
    $("#swLive").setAttribute("aria-checked",State.live);startFeed();return;}
  if(e.target.closest("#drawerClose")||e.target.closest("#drawerClose2")||e.target.closest("#scrim")){closeDrawer();return;}
  if(e.target.closest("#btnAlerts")){State.route="alerts";render();return;}
  if(e.target.closest("#btnLang")){LANG=LANG==="ar"?"en":"ar";applyLang();render();return;}
  if(e.target.closest("#btnTheme")){setTheme(document.documentElement.dataset.theme==="dark"?"light":"dark");render();return;}
  if(e.target.closest("#navToggle")){
    if(innerWidth<900)$("#nav").classList.toggle("open"); else $("#nav").classList.toggle("mini");
    return;}
});

document.addEventListener("keydown",e=>{
  if(e.key==="Escape"){closeDrawer();return;}
  if(e.key==="/"&&document.activeElement!==$("#globalSearch")){e.preventDefault();$("#globalSearch").focus();}
  if(e.key==="Enter"&&e.target.closest(".node")){openThreat(e.target.closest(".node").dataset.open);}
});

let searchTimer=null;
document.addEventListener("input",e=>{
  if(e.target.id!=="globalSearch") return;
  clearTimeout(searchTimer);
  searchTimer=setTimeout(()=>{
    State.q=e.target.value.trim();
    if(!["dashboard","map","matrix","events","countries"].includes(State.route)) State.route="dashboard";
    render();
  },220);
});

/* --- boot ------------------------------------------------------------------ */
(async function boot(){
  setTheme(localStorage.getItem("sanad.theme")||"dark");
  applyLang();
  if(lockNeeded()) await showAppLock();
  paintWatermark();
  const unlocked=Vault.exists()?await showLock():null;
  await DataLayer.fetchAll();
  if(unlocked){ DataLayer.apply(unlocked,{persist:false}); DataLayer.source="imported"; DataLayer.importedAt=null; }
  const shared=await Share.read();
  if(shared){ DataLayer.apply(shared,{persist:false}); DataLayer.source="shared"; DataLayer.importedAt=null; }
  render();
  paintFab();
  tickClock(); setInterval(tickClock,1000);
  setInterval(refreshChrome,60000);
  startFeed();
  if(!shared&&LiveFile.supported()) LiveFile.restore().catch(()=>{});
  setTimeout(()=>{$("#boot").classList.add("off");setTimeout(()=>$("#boot").remove(),600);},650);
  setTimeout(()=>toast("high",LANG==="ar"
    ?"هذه نسخة عرض ببيانات تجريبية — لا تُستخدم للقرار التشغيلي"
    :"Demo build with sample data — not for operational decisions"),1800);
})();
