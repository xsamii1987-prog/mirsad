<!DOCTYPE html>
<!--
  ============================================================================
  MIRSAD  |  منصة الرصد الاستراتيجي ودعم القرار  ·  Strategic Watch & Decision Support
  ----------------------------------------------------------------------------
  Single-file, backend-free HTML5 / CSS3 / ES6+ application.
  Architecture (see bottom of file for the layers):
    1. i18n        - bilingual dictionary + RTL/LTR direction engine
    2. DataLayer   - OSINT integration layer (adapters + normalisation + schema)
    3. Risk        - risk methodology (Probability x Impact x Confidence)
    4. Charts      - dependency-free SVG chart primitives
    5. Views       - Dashboard, Map, Matrix, Countries, Events, AI, Reports,
                     Forecasting, Alerts, Watch List, Sources, Settings
    6. App         - router, state, rendering, accessibility, notifications
  ----------------------------------------------------------------------------
  DEMO DATA NOTICE: every threat record shipped in this file is sample content
  and exists only to demonstrate the interface. It is NOT intelligence and must
  not be read as an assessment of any real situation. Connect real data sources
  before any operational use.
  ============================================================================
-->
<html lang="ar" dir="rtl" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<meta name="description" content="Executive Strategic Threat Dashboard — OSINT decision-support platform (demo build).">
<title>مرصاد · منصة الرصد الاستراتيجي ودعم القرار</title>
<!-- No external requests: the file runs fully offline from a local disk or an
     email attachment. Fonts fall back through installed system families. -->
<style>
/* ===========================================================================
   1. DESIGN TOKENS
   Palette: deep pine ground + Saudi flag green + brass. Brass is the scarce
   material: it marks national-level signals only (index gauge, hairline rules).
   =========================================================================== */
:root{
  --brass:#C9A227; --brass-lt:#E3C765; --brass-dim:rgba(201,162,39,.16);
  --sa-green:#00723B; --sa-green-lt:#17A05C; --sa-green-dim:rgba(23,160,92,.14);

  --sev-low:#5FB98A; --sev-med:#E0BE47; --sev-high:#E2892C; --sev-crit:#D6453C;
  --sev-low-bg:rgba(95,185,138,.13); --sev-med-bg:rgba(224,190,71,.13);
  --sev-high-bg:rgba(226,137,44,.13); --sev-crit-bg:rgba(214,69,60,.14);

  --r-xs:4px; --r-sm:8px; --r-md:12px; --r-lg:16px;
  --sp:8px;
  --hdr:60px; --nav:248px;

  --f-ar:"IBM Plex Sans Arabic","Noto Sans Arabic","Segoe UI","Dubai",Tahoma,"Geeza Pro",sans-serif;
  --f-lt:"IBM Plex Sans","Segoe UI",Inter,Roboto,Arial,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;

  --ease:cubic-bezier(.4,.14,.3,1);
}
[data-theme="dark"]{
  --bg:#06100C; --bg-2:#081611;
  --surface:#0C1A14; --surface-2:#102219; --raised:#14291E;
  --line:#1B3527; --line-soft:rgba(201,162,39,.13);
  --tx:#E9F2EC; --tx-2:#A9C0B3; --tx-3:#6F8B7C;
  --glass:rgba(16,34,25,.62); --glass-brd:rgba(201,162,39,.16);
  --shadow:0 1px 2px rgba(0,0,0,.5),0 12px 32px -12px rgba(0,0,0,.7);
  --map-land:#12261C; --map-brd:#20402F; --grid:rgba(169,192,179,.08);
}
[data-theme="light"]{
  --bg:#F2F5F2; --bg-2:#E9EFEA;
  --surface:#FFFFFF; --surface-2:#F7FAF7; --raised:#FFFFFF;
  --line:#DCE5DE; --line-soft:rgba(0,114,59,.16);
  --tx:#0B1A12; --tx-2:#456055; --tx-3:#7B948A;
  --glass:rgba(255,255,255,.75); --glass-brd:rgba(0,114,59,.16);
  --shadow:0 1px 2px rgba(16,40,28,.06),0 10px 28px -14px rgba(16,40,28,.28);
  --map-land:#DCE7DE; --map-brd:#B7CCBE; --grid:rgba(11,26,18,.07);
  --brass:#8A6E12; --brass-lt:#B08F1E;
  --sev-low:#2F8F60; --sev-med:#B48B00; --sev-high:#C4661A; --sev-crit:#BE2F27;
}

/* ===========================================================================
   2. BASE
   =========================================================================== */
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:var(--bg);color:var(--tx);
  font-family:var(--f-ar);font-size:14px;line-height:1.55;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  overflow:hidden;
}
html[lang="en"] body{font-family:var(--f-lt)}
h1,h2,h3,h4{margin:0;font-weight:600;letter-spacing:-.01em}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer}
a{color:var(--sa-green-lt);text-decoration:none}
:focus-visible{outline:2px solid var(--brass-lt);outline-offset:2px;border-radius:var(--r-xs)}
::selection{background:var(--sa-green);color:#fff}
.num{font-family:var(--f-mono);font-feature-settings:"tnum" 1;direction:ltr;unicode-bidi:isolate}
.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--line);border-radius:9px}
::-webkit-scrollbar-thumb:hover{background:var(--tx-3)}

/* ===========================================================================
   3. APP FRAME
   =========================================================================== */
#app{display:flex;flex-direction:column;height:100vh;height:100dvh}
.header{
  height:var(--hdr);flex:0 0 var(--hdr);display:flex;align-items:center;gap:14px;
  padding:0 16px;background:var(--glass);backdrop-filter:blur(14px) saturate(1.3);
  -webkit-backdrop-filter:blur(14px) saturate(1.3);
  border-bottom:1px solid var(--line);position:relative;z-index:60;
}
.header::after{content:"";position:absolute;inset-inline:0;bottom:-1px;height:1px;
  background:linear-gradient(90deg,transparent,var(--brass-dim) 20%,var(--brass-dim) 80%,transparent)}
.brand{display:flex;align-items:center;gap:11px;min-width:0}
.mark{width:34px;height:34px;flex:none}
.brand-tx{display:flex;flex-direction:column;line-height:1.15;min-width:0}
.brand-tx b{font-size:15px;font-weight:600;letter-spacing:.01em}
.brand-tx span{font-size:10.5px;color:var(--tx-3);letter-spacing:.06em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hdr-sep{width:1px;height:26px;background:var(--line);flex:none}
.search{position:relative;flex:1;max-width:420px;min-width:120px}
.search input{
  width:100%;height:36px;padding-inline:34px 12px;border-radius:var(--r-sm);
  background:var(--surface-2);border:1px solid var(--line);
}
.search input::placeholder{color:var(--tx-3)}
.search input:focus{border-color:var(--sa-green-lt);background:var(--surface)}
.search svg{position:absolute;inset-inline-start:10px;top:9px;width:17px;height:17px;color:var(--tx-3);pointer-events:none}
.search kbd{position:absolute;inset-inline-end:8px;top:8px;font-family:var(--f-mono);font-size:10px;
  color:var(--tx-3);border:1px solid var(--line);border-radius:4px;padding:1px 5px}
.hdr-right{margin-inline-start:auto;display:flex;align-items:center;gap:8px}
.stat{display:flex;flex-direction:column;align-items:flex-start;line-height:1.2;padding-inline:10px}
.stat label{font-size:9.5px;color:var(--tx-3);letter-spacing:.07em;text-transform:uppercase}
.stat b{font-size:13px;font-weight:600}
.iconbtn{width:36px;height:36px;display:grid;place-items:center;border-radius:var(--r-sm);
  border:1px solid var(--line);background:var(--surface-2);color:var(--tx-2);transition:.18s var(--ease)}
.iconbtn:hover{color:var(--tx);border-color:var(--brass);background:var(--raised)}
.iconbtn svg{width:17px;height:17px}
.iconbtn.has-dot{position:relative}
.iconbtn.has-dot::after{content:"";position:absolute;top:6px;inset-inline-end:6px;width:7px;height:7px;
  border-radius:50%;background:var(--sev-crit);box-shadow:0 0 0 2px var(--surface)}
.condition{display:flex;align-items:center;gap:7px;height:36px;padding:0 12px;border-radius:var(--r-sm);
  border:1px solid var(--brass-dim);background:linear-gradient(180deg,rgba(201,162,39,.09),transparent)}
.condition .dot{width:8px;height:8px;border-radius:50%;background:var(--sev-high);animation:pulse 2.6s infinite}
.condition b{font-size:12px;letter-spacing:.04em}
.condition small{font-size:9.5px;color:var(--tx-3);letter-spacing:.08em;text-transform:uppercase}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.45;transform:scale(.82)}}

.shell{flex:1;display:flex;min-height:0}
.nav{
  width:var(--nav);flex:none;background:var(--surface);border-inline-end:1px solid var(--line);
  display:flex;flex-direction:column;overflow-y:auto;transition:width .22s var(--ease);
}
.nav.mini{width:62px}
.nav.mini .nav-lbl,.nav.mini .nav-group,.nav.mini .nav-foot{display:none}
.nav.mini .nav-btn{justify-content:center;padding-inline:0}
.nav-group{padding:16px 18px 6px;font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--tx-3)}
.nav-btn{
  display:flex;align-items:center;gap:11px;width:100%;padding:9px 16px;margin:1px 8px;width:calc(100% - 16px);
  border-radius:var(--r-sm);color:var(--tx-2);font-size:13.5px;text-align:start;transition:.15s var(--ease);position:relative
}
.nav-btn svg{width:17px;height:17px;flex:none;opacity:.85}
.nav-btn:hover{background:var(--surface-2);color:var(--tx)}
.nav-btn[aria-current="page"]{background:var(--sa-green-dim);color:var(--tx);font-weight:500}
.nav-btn[aria-current="page"]::before{content:"";position:absolute;inset-inline-start:-8px;top:8px;bottom:8px;width:3px;
  background:var(--brass);border-radius:0 3px 3px 0}
[dir="rtl"] .nav-btn[aria-current="page"]::before{border-radius:3px 0 0 3px}
.nav-btn .pill{margin-inline-start:auto;font-family:var(--f-mono);font-size:10.5px;padding:1px 6px;border-radius:20px;
  background:var(--sev-crit-bg);color:var(--sev-crit)}
.nav-foot{margin-top:auto;padding:14px 16px;border-top:1px solid var(--line);font-size:11px;color:var(--tx-3)}
.nav-foot .row{display:flex;justify-content:space-between;margin-bottom:5px}

main{flex:1;overflow-y:auto;overflow-x:hidden;scroll-behavior:smooth;position:relative}
.wrap{padding:20px 22px 56px;max-width:1920px;margin:0 auto}
.view{display:none;animation:fade .32s var(--ease)}
.view.on{display:block}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* Demo-data banner: honesty is part of the interface, not a footnote. */
.demo-bar{display:flex;align-items:center;gap:9px;padding:8px 14px;margin-bottom:16px;
  border:1px dashed var(--brass);border-radius:var(--r-sm);background:rgba(201,162,39,.07);
  font-size:11.5px;color:var(--brass-lt)}
.demo-bar svg{width:15px;height:15px;flex:none}

/* ===========================================================================
   4. PRIMITIVES
   =========================================================================== */
.page-head{display:flex;align-items:flex-end;gap:16px;margin-bottom:18px;flex-wrap:wrap}
.page-head h1{font-size:20px;font-weight:600}
.page-head p{font-size:12.5px;color:var(--tx-3);margin-top:3px}
.page-head .spacer{margin-inline-start:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);box-shadow:var(--shadow);position:relative}
.card-h{display:flex;align-items:center;gap:10px;padding:13px 16px;border-bottom:1px solid var(--line)}
.card-h h3{font-size:13.5px;font-weight:600}
.card-h .sub{font-size:11px;color:var(--tx-3)}
.card-h .spacer{margin-inline-start:auto;display:flex;gap:6px;align-items:center}
.card-b{padding:16px}
.card-b.tight{padding:10px 12px}

.grid{display:grid;gap:14px}
.g-kpi{grid-template-columns:repeat(auto-fit,minmax(178px,1fr))}
.g-2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g-3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g-main{grid-template-columns:minmax(0,2.05fr) minmax(0,1fr)}
.g-4{grid-template-columns:repeat(4,minmax(0,1fr))}
.mt{margin-top:14px}

.btn{display:inline-flex;align-items:center;gap:7px;height:34px;padding:0 13px;border-radius:var(--r-sm);
  border:1px solid var(--line);background:var(--surface-2);color:var(--tx-2);font-size:12.5px;transition:.16s var(--ease)}
.btn:hover{color:var(--tx);border-color:var(--brass);background:var(--raised)}
.btn svg{width:15px;height:15px}
.btn.primary{background:linear-gradient(180deg,var(--sa-green-lt),var(--sa-green));color:#fff;border-color:transparent;font-weight:500}
.btn.primary:hover{filter:brightness(1.09)}
.btn.brass{border-color:var(--brass);color:var(--brass-lt);background:rgba(201,162,39,.08)}
.btn.sm{height:28px;padding:0 10px;font-size:11.5px}

.chip{display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 9px;border-radius:20px;
  font-size:11px;border:1px solid var(--line);color:var(--tx-2);background:var(--surface-2);white-space:nowrap}
.chip.on{border-color:var(--sa-green-lt);color:var(--tx);background:var(--sa-green-dim)}
.chip .dot{width:7px;height:7px;border-radius:50%}

.tag{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:20px;font-size:10.5px;font-weight:500;letter-spacing:.02em}
.tag.crit{background:var(--sev-crit-bg);color:var(--sev-crit)}
.tag.high{background:var(--sev-high-bg);color:var(--sev-high)}
.tag.med{background:var(--sev-med-bg);color:var(--sev-med)}
.tag.low{background:var(--sev-low-bg);color:var(--sev-low)}
.tag.neutral{background:var(--surface-2);color:var(--tx-3);border:1px solid var(--line)}

.meter{height:5px;border-radius:5px;background:var(--surface-2);overflow:hidden;border:1px solid var(--line)}
.meter i{display:block;height:100%;border-radius:5px;transition:width .9s var(--ease)}

.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:12.5px}
.kv dt{color:var(--tx-3)}
.kv dd{margin:0;text-align:end}

/* KPI cards */
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:14px;
  position:relative;overflow:hidden;transition:.2s var(--ease);box-shadow:var(--shadow)}
.kpi:hover{transform:translateY(-2px);border-color:var(--brass-dim)}
.kpi::after{content:"";position:absolute;inset-inline-start:0;top:0;bottom:0;width:2px;background:var(--accent,var(--sa-green-lt));opacity:.9}
.kpi label{font-size:10.5px;color:var(--tx-3);letter-spacing:.06em;text-transform:uppercase;display:block}
.kpi .val{font-family:var(--f-mono);font-size:27px;font-weight:600;line-height:1.25;margin-top:4px;letter-spacing:-.02em}
.kpi .val small{font-size:13px;color:var(--tx-3);font-weight:400}
.kpi .delta{font-size:11px;display:flex;align-items:center;gap:4px;margin-top:2px;color:var(--tx-3)}
.kpi .delta.up{color:var(--sev-crit)} .kpi .delta.down{color:var(--sev-low)}
.kpi .spark{position:absolute;inset-inline-end:10px;bottom:10px;opacity:.55}

/* Tables */
.tbl-wrap{overflow:auto;max-height:560px}
table{width:100%;border-collapse:collapse;font-size:12.5px}
thead th{position:sticky;top:0;z-index:2;background:var(--surface-2);text-align:start;font-weight:500;
  font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--tx-3);
  padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap;cursor:pointer;user-select:none}
thead th:hover{color:var(--tx)}
thead th .sort{opacity:.4;font-size:9px}
tbody td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr{transition:background .14s}
tbody tr:hover{background:var(--surface-2)}
tbody tr:last-child td{border-bottom:0}
.t-name{font-weight:500;display:flex;flex-direction:column;gap:2px}
.t-name small{color:var(--tx-3);font-size:10.5px;font-weight:400}

/* Drawer */
.scrim{position:fixed;inset:0;background:rgba(3,10,7,.62);backdrop-filter:blur(3px);z-index:90;opacity:0;pointer-events:none;transition:.24s}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;inset-block:0;inset-inline-end:0;width:min(560px,100%);background:var(--bg-2);
  border-inline-start:1px solid var(--line);z-index:95;display:flex;flex-direction:column;
  transform:translateX(var(--slide,100%));transition:transform .28s var(--ease);box-shadow:-20px 0 60px -30px #000}
[dir="rtl"] .drawer{--slide:-100%}
.drawer.on{transform:translateX(0)}
.drawer-h{padding:16px 18px;border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:flex-start}
.drawer-b{overflow-y:auto;padding:18px;flex:1}
.sec{margin-bottom:20px}
.sec h4{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--brass);margin-bottom:9px;
  display:flex;align-items:center;gap:8px}
.sec h4::after{content:"";flex:1;height:1px;background:var(--line)}
.bullets{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:7px}
.bullets li{position:relative;padding-inline-start:16px;font-size:12.5px;color:var(--tx-2)}
.bullets li::before{content:"";position:absolute;inset-inline-start:2px;top:8px;width:5px;height:5px;
  border-radius:1px;background:var(--brass);transform:rotate(45deg)}

/* Scenario cards */
.scn{border:1px solid var(--line);border-radius:var(--r-sm);padding:11px 12px;background:var(--surface)}
.scn b{font-size:11px;letter-spacing:.06em;text-transform:uppercase}
.scn p{font-size:12px;color:var(--tx-2);margin-top:5px}

/* Toasts */
.toasts{position:fixed;bottom:18px;inset-inline-end:18px;z-index:120;display:flex;flex-direction:column;gap:9px;width:min(340px,calc(100vw - 36px))}
.toast{background:var(--glass);backdrop-filter:blur(12px);border:1px solid var(--glass-brd);border-radius:var(--r-md);
  padding:11px 13px;box-shadow:var(--shadow);display:flex;gap:10px;animation:slideIn .3s var(--ease)}
.toast .bar{width:3px;border-radius:3px;flex:none}
.toast b{font-size:12.5px;display:block}
.toast p{font-size:11.5px;color:var(--tx-2);margin-top:2px}
.toast time{font-size:10px;color:var(--tx-3);font-family:var(--f-mono)}
@keyframes slideIn{from{opacity:0;transform:translateY(10px) scale(.98)}to{opacity:1;transform:none}}

/* Map */
.mapbox{position:relative;background:radial-gradient(1200px 600px at 62% 40%,var(--surface-2),var(--surface));border-radius:0 0 var(--r-md) var(--r-md);overflow:hidden}
.mapbox svg{display:block;width:100%;height:auto}
.land{fill:var(--map-land);stroke:var(--map-brd);stroke-width:.6;vector-effect:non-scaling-stroke}
.graticule{stroke:var(--grid);stroke-width:.5;fill:none;vector-effect:non-scaling-stroke}
.vector{fill:none;stroke-width:1.1;opacity:.5;stroke-dasharray:3 5;animation:flow 3.4s linear infinite}
@keyframes flow{to{stroke-dashoffset:-32}}
.node{cursor:pointer;transition:.18s}
.node:hover .halo{opacity:.55}
.node .halo{opacity:.2;transition:.2s}
.hub{fill:var(--brass-lt)}
.maplegend{position:absolute;inset-inline-start:12px;bottom:12px;display:flex;flex-direction:column;gap:5px;
  background:var(--glass);backdrop-filter:blur(10px);border:1px solid var(--glass-brd);border-radius:var(--r-sm);padding:9px 11px;font-size:11px}
.maplegend .row{display:flex;align-items:center;gap:7px;color:var(--tx-2)}
.maptip{position:absolute;pointer-events:none;z-index:5;background:var(--glass);backdrop-filter:blur(12px);
  border:1px solid var(--glass-brd);border-radius:var(--r-sm);padding:8px 11px;font-size:11.5px;opacity:0;transition:.14s;max-width:230px;box-shadow:var(--shadow)}
.maptip.on{opacity:1}

/* Risk matrix */
.matrix{display:grid;grid-template-columns:auto repeat(4,1fr);gap:5px}
.matrix .axis{display:grid;place-items:center;font-size:10px;color:var(--tx-3);letter-spacing:.05em;text-transform:uppercase;padding:4px}
.cell{min-height:96px;border-radius:var(--r-sm);border:1px solid var(--line);padding:6px;display:flex;flex-direction:column;gap:4px;
  transition:.18s var(--ease)}
.cell:hover{border-color:var(--brass);transform:scale(1.012)}
.cell .cnt{font-family:var(--f-mono);font-size:10px;color:var(--tx-3);align-self:flex-end}
.cell .bead{font-size:10.5px;padding:3px 6px;border-radius:5px;background:var(--surface);border:1px solid var(--line);
  cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cell .bead:hover{border-color:var(--brass-lt);color:var(--tx)}

/* Gauge (signature element) */
.gauge{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.gauge-svg{width:230px;flex:none}
.gauge-read .lvl{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--brass)}
.gauge-read .n{font-family:var(--f-mono);font-size:46px;font-weight:600;line-height:1;letter-spacing:-.03em}
.gauge-read .n small{font-size:16px;color:var(--tx-3)}
.gauge-read p{font-size:12px;color:var(--tx-2);margin-top:7px;max-width:34ch}

/* Insight / recommendation rows */
.ins{display:flex;gap:11px;padding:12px;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--surface-2);transition:.18s}
.ins:hover{border-color:var(--brass-dim);background:var(--raised)}
.ins .idx{font-family:var(--f-mono);font-size:11px;color:var(--brass);flex:none;padding-top:2px}
.ins b{font-size:13px;display:block;margin-bottom:3px}
.ins p{font-size:12px;color:var(--tx-2)}
.ins .meta{display:flex;gap:8px;margin-top:7px;flex-wrap:wrap}

/* Sliders */
.slider-row{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.slider-row label{font-size:12.5px;width:132px;flex:none;color:var(--tx-2)}
input[type=range]{-webkit-appearance:none;appearance:none;flex:1;height:4px;border-radius:4px;background:var(--line);outline:none}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;
  background:var(--brass-lt);border:2px solid var(--bg);cursor:pointer;box-shadow:0 0 0 1px var(--brass)}
input[type=range]::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:var(--brass-lt);border:2px solid var(--bg);cursor:pointer}
select,input[type=text],input[type=search]{height:34px;padding:0 10px;border-radius:var(--r-sm);
  background:var(--surface-2);border:1px solid var(--line)}
select:focus,input:focus{border-color:var(--sa-green-lt);outline:none}

/* Timeline */
.tl{position:relative;padding-inline-start:22px}
.tl::before{content:"";position:absolute;inset-inline-start:6px;top:4px;bottom:4px;width:1px;background:var(--line)}
.tl-item{position:relative;padding-bottom:15px}
.tl-item::before{content:"";position:absolute;inset-inline-start:-20px;top:5px;width:9px;height:9px;border-radius:50%;
  background:var(--bg);border:2px solid var(--sev-med)}
.tl-item time{font-family:var(--f-mono);font-size:10.5px;color:var(--tx-3)}
.tl-item b{display:block;font-size:12.5px;margin-top:1px}
.tl-item p{font-size:11.5px;color:var(--tx-2)}

/* Skeletons */
.skel{border-radius:var(--r-sm);background:linear-gradient(90deg,var(--surface-2) 25%,var(--raised) 37%,var(--surface-2) 63%);
  background-size:400% 100%;animation:shim 1.3s ease infinite}
@keyframes shim{0%{background-position:100% 0}100%{background-position:0 0}}
#boot{position:fixed;inset:0;background:var(--bg);z-index:200;display:grid;place-items:center;transition:opacity .45s .1s}
#boot.off{opacity:0;pointer-events:none}
#boot .bootline{width:220px;height:2px;background:var(--line);margin-top:20px;overflow:hidden;border-radius:2px}
#boot .bootline i{display:block;height:100%;width:35%;background:var(--brass);animation:load 1.1s var(--ease) infinite}
@keyframes load{0%{transform:translateX(-100%)}100%{transform:translateX(340%)}}
#boot .lbl{font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--tx-3);text-align:center;margin-top:14px}

/* Executive brief (print) */
.brief{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:26px;max-width:900px}
.brief-h{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:2px solid var(--brass);padding-bottom:12px;margin-bottom:16px}
.brief h2{font-size:17px}
.brief .classif{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--brass);border:1px solid var(--brass);padding:3px 9px;border-radius:3px}
.brief-sec{margin-bottom:16px}
.brief-sec h3{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--tx-3);margin-bottom:7px;
  border-bottom:1px solid var(--line);padding-bottom:5px}
.brief-sec li,.brief-sec p{font-size:12.5px;color:var(--tx-2)}
.brief-sec ol,.brief-sec ul{margin:0;padding-inline-start:18px;display:flex;flex-direction:column;gap:5px}

/* Sources / settings lists */
.src{display:flex;align-items:center;gap:11px;padding:10px 12px;border-bottom:1px solid var(--line)}
.src:last-child{border-bottom:0}
.src .st{width:8px;height:8px;border-radius:50%;flex:none}
.src b{font-size:12.5px;font-weight:500}
.src small{font-size:11px;color:var(--tx-3)}
.src .spacer{margin-inline-start:auto;display:flex;gap:14px;align-items:center;font-family:var(--f-mono);font-size:11px;color:var(--tx-3)}
.switch{width:40px;height:22px;border-radius:22px;background:var(--line);position:relative;transition:.2s;flex:none}
.switch i{position:absolute;top:3px;inset-inline-start:3px;width:16px;height:16px;border-radius:50%;background:var(--tx-3);transition:.2s}
.switch.on{background:var(--sa-green)}
.switch.on i{inset-inline-start:21px;background:#fff}

/* Viewer copies: every control that changes or exports data is removed. */
html[data-mode="viewer"] [data-route="data"],
html[data-mode="viewer"] #btnExport,
html[data-mode="viewer"] #btnExport2,
html[data-mode="viewer"] #btnPrint{display:none!important}
.copymark{font-size:10.5px;color:var(--brass);border:1px solid var(--brass-dim);
  border-radius:20px;padding:2px 9px;white-space:nowrap}
@media (max-width:900px){ .copymark{display:none} }

/* Name watermark: present, readable, never in the way of the numbers. */
#wm{position:fixed;inset:0;z-index:50;pointer-events:none;opacity:.05;background-repeat:repeat}
[data-theme="light"] #wm{opacity:.07}
@media print{ #wm{display:block!important;opacity:.13;position:fixed} }

/* ===========================================================================
   5. RESPONSIVE
   =========================================================================== */
@media (max-width:1400px){ .g-4{grid-template-columns:repeat(2,minmax(0,1fr))} }
@media (max-width:1180px){
  .g-main{grid-template-columns:1fr}
  .g-3{grid-template-columns:1fr}
  .hdr-right .stat{display:none}
}
@media (max-width:900px){
  .nav{position:fixed;inset-block:var(--hdr) 0;z-index:80;transform:translateX(var(--off,-100%))}
  [dir="rtl"] .nav{--off:100%}
  .nav.open{transform:translateX(0)}
  .g-2{grid-template-columns:1fr}
  .search{max-width:none}
  .condition{display:none}
}
@media (max-width:620px){
  .wrap{padding:14px 12px 84px}
  .brand-tx span{display:none}
  .hdr-sep{display:none}
  .search{min-width:0}
  .search kbd{display:none}
  .kpi{padding:11px}
  .kpi .val{font-size:20px}
  .kpi label{font-size:9.5px}
  .g-kpi{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
  .g-3,.g-4{grid-template-columns:1fr}
  .gauge-svg{width:100%}
  .page-head h1{font-size:17px}
  .card-b{padding:12px}
  .matrix{grid-template-columns:auto repeat(4,1fr);gap:3px}
  .cell{min-height:74px;padding:4px}
  .cell .bead{font-size:9.5px;padding:2px 4px}
  .maplegend{font-size:10px;padding:6px 8px}
  .toasts{inset-inline:12px;bottom:76px;width:auto}
}

/* ---------- Review notes: a reviewer on a phone needs one thumb ---------- */
.fab{position:fixed;bottom:18px;inset-inline-start:18px;z-index:110;display:flex;align-items:center;gap:8px;
  height:46px;padding:0 16px;border-radius:46px;background:var(--brass);color:#12100A;font-weight:600;font-size:13px;
  box-shadow:0 6px 20px -6px rgba(0,0,0,.6);transition:.18s var(--ease)}
.fab:hover{filter:brightness(1.08);transform:translateY(-1px)}
.fab svg{width:18px;height:18px}
.fab .count{background:#12100A;color:var(--brass-lt);border-radius:20px;font-family:var(--f-mono);font-size:11px;padding:1px 7px}
.sheet{position:fixed;z-index:115;inset-inline-start:0;bottom:0;width:min(460px,100%);max-height:86vh;
  background:var(--bg-2);border:1px solid var(--line);border-radius:var(--r-lg) var(--r-lg) 0 0;
  display:flex;flex-direction:column;transform:translateY(102%);transition:transform .28s var(--ease);
  box-shadow:0 -20px 60px -30px #000}
.sheet.on{transform:translateY(0)}
.sheet-h{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;align-items:flex-start;gap:10px}
.sheet-b{padding:16px;overflow-y:auto}
.sheet-f{padding:12px 16px;border-top:1px solid var(--line);display:flex;gap:8px;flex-wrap:wrap}
.sheet textarea{width:100%;min-height:88px;resize:vertical;padding:10px;border-radius:var(--r-sm);
  background:var(--surface-2);border:1px solid var(--line);font-size:13px;line-height:1.5}
.sheet textarea:focus{border-color:var(--sa-green-lt);outline:none}
.note{border:1px solid var(--line);border-radius:var(--r-sm);padding:10px;background:var(--surface);margin-bottom:8px}
.note b{font-size:11px;color:var(--brass)}
.note p{font-size:12.5px;color:var(--tx-2);margin-top:4px;white-space:pre-wrap}
.note time{font-size:10px;color:var(--tx-3);font-family:var(--f-mono)}
@media (max-width:620px){ .fab{bottom:14px;inset-inline-start:14px;height:44px} .sheet{width:100%} }
@media print{ .fab,.sheet,.sheet-scrim{display:none!important} }
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}
}
@media print{
  .header,.nav,.demo-bar,.page-head .spacer,.toasts{display:none!important}
  body,main{overflow:visible;height:auto}
  .brief{border:0;padding:0;max-width:none}
  *{color:#000!important;background:#fff!important}
  .brief .classif,.brief-h{border-color:#000!important}
}
</style>
</head>
<body>

<!-- ── Boot sequence ─────────────────────────────────────────────────────── -->
<div id="boot" role="status" aria-live="polite">
  <div>
    <svg width="56" height="56" viewBox="0 0 40 40" aria-hidden="true" style="margin:0 auto;display:block">
      <defs><linearGradient id="bg1" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#E3C765"/><stop offset="1" stop-color="#00723B"/></linearGradient></defs>
      <path d="M20 2 L35 9.5 V22 C35 30 28.5 36 20 38.5 C11.5 36 5 30 5 22 V9.5 Z" fill="none" stroke="url(#bg1)" stroke-width="1.6"/>
      <path d="M20 11 v18 M13 15 v10 M27 15 v10" stroke="#C9A227" stroke-width="1.4" stroke-linecap="round"/>
    </svg>
    <div class="bootline"><i></i></div>
    <div class="lbl" id="bootLbl">Initialising intelligence layer</div>
  </div>
</div>

<div id="app">

  <!-- ── Header ─────────────────────────────────────────────────────────── -->
  <header class="header">
    <button class="iconbtn" id="navToggle" aria-label="Toggle navigation">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
    </button>

    <div class="brand">
      <svg class="mark" viewBox="0 0 40 40" aria-hidden="true">
        <defs><linearGradient id="mk" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#E3C765"/><stop offset="1" stop-color="#17A05C"/></linearGradient></defs>
        <path d="M20 2 L35 9.5 V22 C35 30 28.5 36 20 38.5 C11.5 36 5 30 5 22 V9.5 Z" fill="none" stroke="url(#mk)" stroke-width="1.7"/>
        <path d="M20 11 v18 M13 15 v10 M27 15 v10" stroke="#C9A227" stroke-width="1.5" stroke-linecap="round"/>
      </svg>
      <span class="brand-tx">
        <b data-i18n="app.name">مرصاد</b>
        <span data-i18n="app.tagline">Strategic Watch &amp; Decision Support</span>
      </span>
    </div>

    <span id="copyMark" class="copymark" hidden></span>


    <div class="hdr-sep" aria-hidden="true"></div>

    <div class="search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="globalSearch" type="search" data-i18n-ph="search.ph" placeholder="بحث في التهديدات والدول والمصادر…" aria-label="Search">
      <kbd>/</kbd>
    </div>

    <div class="hdr-right">
      <div class="stat"><label data-i18n="hdr.updated">Last update</label><b class="num" id="hdrUpdated">—</b></div>
      <div class="stat"><label data-i18n="hdr.clock">Riyadh time</label><b class="num" id="hdrClock">—:—:—</b></div>
      <div class="condition" title="National Threat Condition">
        <span class="dot" id="condDot"></span>
        <span style="display:flex;flex-direction:column;line-height:1.15">
          <small data-i18n="hdr.condition">National threat level</small>
          <b id="condLbl">—</b>
        </span>
      </div>
      <button class="iconbtn has-dot" id="btnAlerts" aria-label="Alerts">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M18 8a6 6 0 1 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>
      </button>
      <button class="iconbtn" id="btnLang" aria-label="Switch language"><b style="font-size:12px" id="langLbl">EN</b></button>
      <button class="iconbtn" id="btnTheme" aria-label="Switch theme">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" id="themeIcon"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8"/></svg>
      </button>
    </div>
  </header>

  <div class="shell">
    <!-- ── Sidebar ──────────────────────────────────────────────────────── -->
    <nav class="nav" id="nav" aria-label="Primary">
      <div class="nav-group" data-i18n="nav.g1">Situation</div>
      <button class="nav-btn" data-route="dashboard"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg><span class="nav-lbl" data-i18n="nav.dashboard">Dashboard</span></button>
      <button class="nav-btn" data-route="map"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a15 15 0 0 1 0 18a15 15 0 0 1 0-18"/></svg><span class="nav-lbl" data-i18n="nav.map">Threat map</span></button>
      <button class="nav-btn" data-route="matrix"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M9 3v18M15 3v18M3 9h18M3 15h18"/></svg><span class="nav-lbl" data-i18n="nav.matrix">Risk matrix</span></button>
      <button class="nav-btn" data-route="events"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M12 9v4m0 4h.01M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0Z"/></svg><span class="nav-lbl" data-i18n="nav.events">Critical events</span><span class="pill num" id="pillCrit">0</span></button>
      <button class="nav-btn" data-route="countries"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M4 22V4m0 0 8 2 8-2v11l-8 2-8-2"/></svg><span class="nav-lbl" data-i18n="nav.countries">Countries</span></button>

      <div class="nav-group" data-i18n="nav.g2">Analysis</div>
      <button class="nav-btn" data-route="forecast"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M3 17 9 11l4 4 8-8"/><path d="M21 3h-5m5 0v5"/></svg><span class="nav-lbl" data-i18n="nav.forecast">Forecasting</span></button>
      <button class="nav-btn" data-route="simulator"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M4 20h16M6 16V9m5 7V5m5 11v-4"/></svg><span class="nav-lbl" data-i18n="nav.sim">Scenario simulator</span></button>
      <button class="nav-btn" data-route="reports"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8Z"/><path d="M14 3v5h5M9 13h6M9 17h4"/></svg><span class="nav-lbl" data-i18n="nav.reports">Executive brief</span></button>

      <div class="nav-group" data-i18n="nav.g3">Operations</div>
      <button class="nav-btn" data-route="alerts"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M18 8a6 6 0 1 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg><span class="nav-lbl" data-i18n="nav.alerts">Alerts</span></button>
      <button class="nav-btn" data-route="watchlist"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg><span class="nav-lbl" data-i18n="nav.watch">Watch list</span></button>
      <button class="nav-btn" data-route="data"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M12 3v12m0 0 4-4m-4 4-4-4"/><path d="M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/></svg><span class="nav-lbl" data-i18n="nav.data">My data</span></button>
      <button class="nav-btn" data-route="sources"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><ellipse cx="12" cy="5" rx="8" ry="3"/><path d="M4 5v14c0 1.7 3.6 3 8 3s8-1.3 8-3V5M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/></svg><span class="nav-lbl" data-i18n="nav.sources">Data sources</span></button>
      <button class="nav-btn" data-route="settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-2.9 1.2 2 2 0 1 1-4 0 1.7 1.7 0 0 0-2.9-1.2l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1A1.7 1.7 0 0 0 3 15a2 2 0 1 1 0-4 1.7 1.7 0 0 0 1.2-2.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1A1.7 1.7 0 0 0 10 4.6a2 2 0 1 1 4 0 1.7 1.7 0 0 0 2.9 1.2l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1A1.7 1.7 0 0 0 21 11a2 2 0 1 1 0 4Z"/></svg><span class="nav-lbl" data-i18n="nav.settings">Settings</span></button>

      <div class="nav-foot">
        <div class="row"><span data-i18n="foot.feeds">Feeds online</span><b class="num" id="footFeeds">—</b></div>
        <div class="row"><span data-i18n="foot.latency">Ingest latency</span><b class="num" id="footLat">—</b></div>
        <div class="row"><span data-i18n="foot.build">Build</span><b class="num">v1.0 · demo</b></div>
      </div>
    </nav>

    <!-- ── Views ────────────────────────────────────────────────────────── -->
    <main id="main" tabindex="-1">
      <div class="wrap">
        <div class="demo-bar" role="note" id="dataBar">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M12 8v5m0 3h.01"/></svg>
          <span id="dataBarTx" data-i18n="demo.notice">Demo build — the records below are sample data for interface demonstration only.</span>
        </div>

        <section class="view" id="v-dashboard" role="region" aria-label="Dashboard"></section>
        <section class="view" id="v-map" role="region" aria-label="Threat map"></section>
        <section class="view" id="v-matrix" role="region" aria-label="Risk matrix"></section>
        <section class="view" id="v-events" role="region" aria-label="Critical events"></section>
        <section class="view" id="v-countries" role="region" aria-label="Countries"></section>
        <section class="view" id="v-ai" role="region" aria-label="Correlation analysis"></section>
        <section class="view" id="v-forecast" role="region" aria-label="Forecasting"></section>
        <section class="view" id="v-simulator" role="region" aria-label="Scenario simulator"></section>
        <section class="view" id="v-reports" role="region" aria-label="Executive brief"></section>
        <section class="view" id="v-alerts" role="region" aria-label="Alerts"></section>
        <section class="view" id="v-watchlist" role="region" aria-label="Watch list"></section>
        <section class="view" id="v-data" role="region" aria-label="My data"></section>
        <section class="view" id="v-sources" role="region" aria-label="Data sources"></section>
        <section class="view" id="v-settings" role="region" aria-label="Settings"></section>
      </div>
    </main>
  </div>
</div>

<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-labelledby="drawerTitle" aria-hidden="true"></aside>
<div class="toasts" id="toasts" aria-live="polite" aria-atomic="false"></div>

<!-- Review notes: collected on the reviewer's own device, sent back in one tap -->
<button class="fab" id="fabNotes" aria-label="Review notes">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2Z"/></svg>
  <span id="fabLbl">ملاحظات</span><span class="count" id="fabCount" hidden>0</span>
</button>
<aside class="sheet" id="noteSheet" role="dialog" aria-modal="true" aria-labelledby="noteTitle" aria-hidden="true"></aside>

<script>
/* ---------------------------------------------------------------------------
   BRANDING — the only place the platform name and strapline are defined.
   Change these four strings to rename the whole application.
   --------------------------------------------------------------------------- */
const BRAND={

/* Deterministic pseudo-random generator: keeps the demo reproducible so the
   same record always draws the same trajectory across reloads. */
function seeded(seed){let s=seed>>>0||1;return()=>{s^=s<<13;s^=s>>>17;s^=s<<5;return((s>>>0)%1000)/1000}}
function trajectory(seed,trend,end){
  const r=seeded(seed),out=[];const slope={up:-0.55,flat:0,down:0.5}[trend]||0;
  for(let k=11;k>=0;k--){const drift=slope*k*(end/22);const noise=(r()-0.5)*9;
    out.unshift(Math.max(6,Math.min(99,Math.round(end+drift+noise))));}
  out[11]=end;return out;
}

/* ===========================================================================
   LAYER 6 — RISK METHODOLOGY
   Risk = Probability × Impact × Confidence, normalised to 0–100.
   Confidence is applied as a dampener (0.55–1.00) rather than a raw multiplier
   so that a high-impact, low-confidence signal is discounted but never erased.
   =========================================================================== */
const Risk={
  score(t){ return Math.round((t.p*t.i)/16*(0.55+0.45*t.c)*100); },
  band(s){ return s>=75?"crit":s>=55?"high":s>=35?"med":"low"; },
  bandKey(s){ return {crit:"lvl.crit",high:"lvl.high",med:"lvl.med",low:"lvl.low"}[Risk.band(s)]; },
  colour(s){ return {crit:"var(--sev-crit)",high:"var(--sev-high)",med:"var(--sev-med)",low:"var(--sev-low)"}[Risk.band(s)]; },
  confBand(c){ return c>=.75?"conf.high":c>=.6?"conf.med":"conf.low"; },
  /* National Threat Index: severity-weighted mean of live records. Critical
     records carry triple weight so a single crisis cannot be averaged away. */
  nti(list){
    const live=list.filter(t=>t.st!=="contained"); if(!live.length) return 0;
    let n=0,d=0; live.forEach(t=>{const s=Risk.score(t);const w=s>=75?3:s>=55?2:1;n+=s*w;d+=w;});
    return Math.round(n/d);
  },
  ntiLevel(v){
    if(v>=78) return {key:"lvl.crit",ar:"حرج",en:"SEVERE",col:"var(--sev-crit)"};
    if(v>=62) return {key:"lvl.high",ar:"مرتفع",en:"HIGH",col:"var(--sev-high)"};
    if(v>=45) return {key:"lvl.med",ar:"متوسط",en:"ELEVATED",col:"var(--sev-med)"};
    return {key:"lvl.low",ar:"منخفض",en:"GUARDED",col:"var(--sev-low)"};
  },
  /* Escalation likelihood blends probability, velocity and trend. */
  escalation(t){
    const v={slow:0,steady:8,fast:18}[t.vel]||0, tr={up:12,flat:0,down:-10}[t.tr]||0;
    return Math.max(4,Math.min(96,Math.round(t.p*17+v+tr+(t.c-0.7)*12)));
  },
  containment(t){ return 100-Risk.escalation(t); }
};

/* ===========================================================================
   LAYER 7 — DATA INTEGRATION LAYER
   The whole application reads from DataLayer.all() and never from the raw
   array. To go live: implement fetch() per adapter, return records in the same
   schema, and normalise() will handle scoring, trajectories and validation.
   No other layer needs to change.
   =========================================================================== */
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
/* JSON round-trips turn NaN into null, so "missing" has to be tested by parse
   rather than by truthiness — otherwise a blank cell silently becomes zero. */
const num=(v,def)=>{const n=parseFloat(v); return Number.isFinite(n)?n:def;};
const hashStr=s=>{let h=2166136261;for(let i=0;i<String(s).length;i++){h^=String(s).charCodeAt(i);h=Math.imul(h,16777619);}return h>>>0;};

/* Local persistence. Falls back to memory when storage is blocked (some
   browsers restrict localStorage on file:// URLs). */
const Store={
  KEY:"sanad.dataset", _mem:null,
  save(records){
    const payload={at:Date.now(),records};
    try{ localStorage.setItem(this.KEY,JSON.stringify(payload)); }catch(e){ this._mem=payload; }
    return payload;
  },
  load(){
    try{ const raw=localStorage.getItem(this.KEY); if(raw) return JSON.parse(raw); }catch(e){}
    return this._mem;
  },
  clear(){ try{ localStorage.removeItem(this.KEY); }catch(e){} this._mem=null; }
};

const DataLayer={
  adapters:{
    /* id : { url, transform, refresh(ms) } — wire real OSINT endpoints here when
       an online deployment is wanted. The offline build feeds itself from the
       spreadsheet importer instead, which produces the same schema. */
  },
  _cache:[], _raw:[], source:"demo", importedAt:null,

  /* Defensive normalisation: any missing field is filled rather than thrown,
     so a half-completed spreadsheet row still renders a usable record. */
  normalise(raw){
    return raw.map((r,idx)=>{
      const rec=JSON.parse(JSON.stringify(r));
      rec.id=rec.id||("REC-"+(1000+idx));
      rec.cat=CATS.includes(rec.cat)?rec.cat:"security";
      rec.p=clamp(Math.round(num(rec.p,2)),1,4);
      rec.i=clamp(Math.round(num(rec.i,2)),1,4);
      rec.c=clamp(num(rec.c,0.6)||0.6,0.05,1);
      rec.hz=["now","short","mid","long"].includes(rec.hz)?rec.hz:"short";
      rec.vel=["slow","steady","fast"].includes(rec.vel)?rec.vel:"steady";
      rec.tr=["up","flat","down"].includes(rec.tr)?rec.tr:"flat";
      rec.st=["active","watch","new","contained"].includes(rec.st)?rec.st:"active";
      rec.lat=clamp(num(rec.lat,HUB.lat),-90,90);
      rec.lon=clamp(num(rec.lon,HUB.lon),-180,180);
      rec.upd=Math.max(0,Math.round(num(rec.upd,60)));
      rec.src=Array.isArray(rec.src)&&rec.src.length?rec.src:["WIRE"];
      rec.ar=Object.assign({n:rec.id,cty:"—",d:""},rec.ar||{});
      rec.en=Object.assign({n:rec.ar.n,cty:rec.ar.cty,d:rec.ar.d},rec.en||{});
      rec.sec=Object.assign({econ:0,energy:0,security:0,transport:0,health:0,invest:0,vision:0},rec.sec||{});
      sectorKeys.forEach(k=>{rec.sec[k]=clamp(Math.round(num(rec.sec[k],0)),0,100);});
      const emptyList=o=>!o||!((o.ar&&o.ar.length)||(o.en&&o.en.length));
      if(emptyList(rec.rel)) rec.rel={ar:[],en:[]};
      if(emptyList(rec.ewi)) rec.ewi=PLAYBOOK[rec.cat].ewi;
      if(emptyList(rec.eff)) rec.eff=PLAYBOOK[rec.cat].eff;
      ["rel","ewi","eff"].forEach(k=>{
        rec[k].ar=rec[k].ar&&rec[k].ar.length?rec[k].ar:(rec[k].en||[]);
        rec[k].en=rec[k].en&&rec[k].en.length?rec[k].en:(rec[k].ar||[]);
      });
      const score=Risk.score(rec);
      rec.score=score; rec.band=Risk.band(score);
      rec.hist=Array.isArray(rec.hist)&&rec.hist.length===12?rec.hist:trajectory(hashStr(rec.id)+idx*977,rec.tr,score);
      rec.updAt=new Date(Date.now()-rec.upd*60000);
      return rec;
    }).sort((a,b)=>b.score-a.score);
  },

  async fetchAll(){
    /* A locked vault takes precedence: nothing loads until it is unlocked. */
    if(typeof Vault!=="undefined"&&Vault.exists()&&!Vault.active){
      this._raw=T; this.source="demo"; this.importedAt=null;
      this._cache=this.normalise(T); return this._cache;
    }
    const saved=Store.load();
    if(saved&&Array.isArray(saved.records)&&saved.records.length){
      this._raw=saved.records; this.source="imported"; this.importedAt=saved.at;
    }else{
      this._raw=T; this.source="demo"; this.importedAt=null;
    }
    this._cache=this.normalise(this._raw);
    return this._cache;
  },

  /* Called by the spreadsheet importer. */
  apply(records,{persist=true}={}){
    this._raw=records; this.source="imported";
    this._cache=this.normalise(records);
    const ephemeral=typeof Session!=="undefined"&&Session.on;
    if(persist&&!ephemeral){
      if(typeof Vault!=="undefined"&&Vault.active){ Vault.save(records); this.importedAt=Date.now(); }
      else{ this.importedAt=Store.save(records).at; }
    }
    return this._cache;
  },
  resetDemo(){
    Store.clear(); this._raw=T; this.source="demo"; this.importedAt=null;
    this._cache=this.normalise(T); return this._cache;
  },
  raw(){ return this._raw; },
  all(){ return this._cache; },
  byId(id){ return this._cache.find(t=>t.id===id); },
  health(){ const on=SOURCES.filter(s=>s.up).length; return {on,total:SOURCES.length,pct:Math.round(on/SOURCES.length*100)}; }
};

const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let LANG=localStorage.getItem("sanad.lang")||"ar";
const t=k=>(I18N[LANG][k]!==undefined?I18N[LANG][k]:(I18N.en[k]||k));
const L=o=>o[LANG]||o.en;
const nf=n=>new Intl.NumberFormat(LANG==="ar"?"ar-SA":"en-US",{maximumFractionDigits:0}).format(n);
function ago(mins){
  if(mins<60) return LANG==="ar"?`قبل ${nf(mins)} د`:`${mins}m ago`;
  const h=Math.floor(mins/60); if(h<24) return LANG==="ar"?`قبل ${nf(h)} س`:`${h}h ago`;
  const d=Math.floor(h/24); return LANG==="ar"?`قبل ${nf(d)} ي`:`${d}d ago`;
}
function catColour(c){
  return {security:"#D6453C",military:"#E2892C",cyber:"#7C6BE8",economic:"#E0BE47",
          environmental:"#3FA9A0",health:"#E86FA6",maritime:"#3E86D6",aerospace:"#9BA7B4"}[c];
}

/* ===========================================================================
   LAYER 9 — CHART PRIMITIVES (pure SVG, no libraries)
   Every chart is a string builder so views stay declarative and printable.
   =========================================================================== */
const Chart={
  spark(v,w=76,h=26,col="var(--sa-green-lt)"){
    const mn=Math.min(...v),mx=Math.max(...v),r=(mx-mn)||1;
    const pts=v.map((n,i)=>[i/(v.length-1)*w,h-((n-mn)/r)*(h-3)-1.5]);
    const d=pts.map((p,i)=>(i?"L":"M")+p[0].toFixed(1)+" "+p[1].toFixed(1)).join(" ");
    return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" aria-hidden="true">
      <path d="${d}" fill="none" stroke="${col}" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
  },

  line(series,labels,{h=250,area=true,max=100}={}){
    const w=760,pl=34,pr=10,pt=12,pb=24,iw=w-pl-pr,ih=h-pt-pb;
    const x=i=>pl+i/(labels.length-1)*iw, y=v=>pt+ih-(v/max)*ih;
    let g="";
    for(let k=0;k<=4;k++){const yy=pt+ih*k/4;
      g+=`<line x1="${pl}" y1="${yy}" x2="${w-pr}" y2="${yy}" stroke="var(--grid)" stroke-width="1"/>
          <text x="${pl-7}" y="${yy+3.5}" text-anchor="end" fill="var(--tx-3)" font-size="9" font-family="var(--f-mono)">${max-max*k/4}</text>`;}
    labels.forEach((lb,i)=>{ if(i%Math.ceil(labels.length/8)) return;
      g+=`<text x="${x(i)}" y="${h-7}" text-anchor="middle" fill="var(--tx-3)" font-size="9">${esc(lb)}</text>`;});
    let p="";
    series.forEach(s=>{
      const d=s.v.map((n,i)=>(i?"L":"M")+x(i).toFixed(1)+" "+y(n).toFixed(1)).join(" ");
      if(area) p+=`<path d="${d} L ${x(s.v.length-1)} ${pt+ih} L ${pl} ${pt+ih} Z" fill="${s.col}" opacity=".09"/>`;
      p+=`<path d="${d}" fill="none" stroke="${s.col}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <animate attributeName="stroke-dasharray" from="0 2000" to="2000 0" dur=".9s" fill="freeze"/></path>`;
      p+=s.v.map((n,i)=>`<circle cx="${x(i).toFixed(1)}" cy="${y(n).toFixed(1)}" r="2.6" fill="var(--surface)" stroke="${s.col}" stroke-width="1.6"><title>${esc(labels[i])}: ${n}</title></circle>`).join("");
    });
    return `<svg viewBox="0 0 ${w} ${h}" width="100%" role="img">${g}${p}</svg>`;
  },

  bars(items,{h=210,horizontal=false}={}){
    const max=Math.max(...items.map(i=>i.v),1);
    if(horizontal){
      return `<div style="display:flex;flex-direction:column;gap:9px">`+items.map(i=>`
        <div>
          <div style="display:flex;justify-content:space-between;font-size:11.5px;margin-bottom:4px">
            <span style="color:var(--tx-2)">${esc(i.l)}</span><b class="num">${nf(i.v)}</b></div>
          <div class="meter"><i style="width:${i.v/max*100}%;background:${i.c||"var(--sa-green-lt)"}"></i></div>
        </div>`).join("")+`</div>`;
    }
    const w=520,pb=30,pt=8,ih=h-pb-pt,bw=w/items.length;
    return `<svg viewBox="0 0 ${w} ${h}" width="100%" role="img">`+items.map((i,k)=>{
      const bh=i.v/max*ih,x=k*bw+bw*.18,y=pt+ih-bh;
      return `<rect x="${x}" y="${y}" width="${bw*.64}" height="${bh}" rx="3" fill="${i.c||"var(--sa-green-lt)"}" opacity=".9">
        <animate attributeName="height" from="0" to="${bh}" dur=".7s" fill="freeze"/>
        <animate attributeName="y" from="${pt+ih}" to="${y}" dur=".7s" fill="freeze"/><title>${esc(i.l)}: ${i.v}</title></rect>
        <text x="${k*bw+bw/2}" y="${h-16}" text-anchor="middle" font-size="9" fill="var(--tx-3)">${esc(i.s||i.l)}</text>
        <text x="${k*bw+bw/2}" y="${h-4}" text-anchor="middle" font-size="9.5" font-family="var(--f-mono)" fill="var(--tx-2)">${i.v}</text>`;
    }).join("")+`</svg>`;
  },

  donut(items,size=176){
    const tot=items.reduce((a,b)=>a+b.v,0)||1,R=size/2,r=R-9,c=2*Math.PI*r;let off=0;
    const arcs=items.map(i=>{const len=i.v/tot*c;const s=`<circle cx="${R}" cy="${R}" r="${r}" fill="none" stroke="${i.c}" stroke-width="15"
      stroke-dasharray="${len} ${c-len}" stroke-dashoffset="${-off}" transform="rotate(-90 ${R} ${R})"><title>${esc(i.l)}: ${i.v}</title></circle>`;off+=len;return s;}).join("");
    return `<svg viewBox="0 0 ${size} ${size}" width="${size}" height="${size}" role="img">
      <circle cx="${R}" cy="${R}" r="${r}" fill="none" stroke="var(--surface-2)" stroke-width="15"/>${arcs}
      <text x="${R}" y="${R-2}" text-anchor="middle" font-family="var(--f-mono)" font-size="24" font-weight="600" fill="var(--tx)">${tot}</text>
      <text x="${R}" y="${R+15}" text-anchor="middle" font-size="9.5" fill="var(--tx-3)">${esc(t("kpi.active"))}</text></svg>`;
  },

  radar(vals,labels,size=260){
    const R=size/2,cx=R,cy=R,rad=R-40,n=vals.length;
    const pt=(i,v)=>{const a=-Math.PI/2+i/n*2*Math.PI;return[cx+Math.cos(a)*rad*v/100,cy+Math.sin(a)*rad*v/100];};
    let rings="";
    [25,50,75,100].forEach(p=>{const d=Array.from({length:n},(_,i)=>pt(i,p)).map((q,i)=>(i?"L":"M")+q[0].toFixed(1)+" "+q[1].toFixed(1)).join(" ")+" Z";
      rings+=`<path d="${d}" fill="none" stroke="var(--grid)" stroke-width="1"/>`;});
    const poly=vals.map((v,i)=>pt(i,v)).map((q,i)=>(i?"L":"M")+q[0].toFixed(1)+" "+q[1].toFixed(1)).join(" ")+" Z";
    const dots=vals.map((v,i)=>{const q=pt(i,v);return `<circle cx="${q[0].toFixed(1)}" cy="${q[1].toFixed(1)}" r="3" fill="var(--brass-lt)"><title>${esc(labels[i])}: ${v}</title></circle>`;}).join("");
    const tx=labels.map((l,i)=>{const q=pt(i,120);return `<text x="${q[0].toFixed(1)}" y="${q[1].toFixed(1)}" text-anchor="middle" font-size="9.5" fill="var(--tx-3)">${esc(l)}</text>`;}).join("");
    return `<svg viewBox="0 0 ${size} ${size}" width="100%" style="max-width:${size}px" role="img">${rings}
      <path d="${poly}" fill="var(--sa-green-lt)" fill-opacity=".16" stroke="var(--sa-green-lt)" stroke-width="1.8"/>${dots}${tx}</svg>`;
  },

  /* Signature element: brass arc gauge for the National Threat Index. */
  gauge(v){
    const w=230,h=140,cx=115,cy=118,r=92,a0=Math.PI,a1=0;
    const pol=(a,rr)=>[cx+Math.cos(a)*rr,cy-Math.sin(a)*rr];
    const arc=(from,to,rr)=>{const s=pol(from,rr),e=pol(to,rr);
      return `M ${s[0].toFixed(1)} ${s[1].toFixed(1)} A ${rr} ${rr} 0 0 1 ${e[0].toFixed(1)} ${e[1].toFixed(1)}`;};
    const bands=[[0,45,"var(--sev-low)"],[45,62,"var(--sev-med)"],[62,78,"var(--sev-high)"],[78,100,"var(--sev-crit)"]];
    const ang=p=>a0-(p/100)*(a0-a1);
    let seg=bands.map(b=>`<path d="${arc(ang(b[0]),ang(b[1]),r)}" stroke="${b[2]}" stroke-width="9" fill="none" opacity=".85" stroke-linecap="butt"/>`).join("");
    let ticks="";for(let p=0;p<=100;p+=10){const a=ang(p),i1=pol(a,r-8),o1=pol(a,r-14);
      ticks+=`<line x1="${i1[0].toFixed(1)}" y1="${i1[1].toFixed(1)}" x2="${o1[0].toFixed(1)}" y2="${o1[1].toFixed(1)}" stroke="var(--tx-3)" stroke-width="1" opacity=".55"/>`;}
    const na=ang(v),tip=pol(na,r-18),base1=pol(na-Math.PI/2,5),base2=pol(na+Math.PI/2,5);
    return `<svg class="gauge-svg" viewBox="0 0 ${w} ${h}" role="img" aria-label="National Threat Index ${v}">
      ${seg}${ticks}
      <polygon points="${tip[0].toFixed(1)},${tip[1].toFixed(1)} ${base1[0].toFixed(1)},${base1[1].toFixed(1)} ${base2[0].toFixed(1)},${base2[1].toFixed(1)}"
        fill="var(--brass-lt)" style="transition:all .9s cubic-bezier(.4,.14,.3,1)"/>
      <circle cx="${cx}" cy="${cy}" r="6.5" fill="var(--surface)" stroke="var(--brass)" stroke-width="2"/>
      <text x="${cx-r+2}" y="${cy+14}" font-size="9" fill="var(--tx-3)" font-family="var(--f-mono)">0</text>
      <text x="${cx+r-8}" y="${cy+14}" font-size="9" fill="var(--tx-3)" font-family="var(--f-mono)">100</text></svg>`;
  },

  /* Equirectangular projection tuned to the populated latitude band. */
  proj(lon,lat,w=980,h=440){
    const x=(lon+180)/360*w, y=(78-lat)/(78+56)*h; return [x,y];
  }
};

    return `<path class="land" d="${d}"/>`;
  }).join("");
  let grat="";
  for(let lon=-180;lon<=180;lon+=30){const a=Chart.proj(lon,78,W,H),b=Chart.proj(lon,-56,W,H);
    grat+=`<line class="graticule" x1="${a[0].toFixed(1)}" y1="${a[1].toFixed(1)}" x2="${b[0].toFixed(1)}" y2="${b[1].toFixed(1)}"/>`;}
  for(let lat=-40;lat<=70;lat+=20){const a=Chart.proj(-180,lat,W,H),b=Chart.proj(180,lat,W,H);
    grat+=`<line class="graticule" x1="${a[0].toFixed(1)}" y1="${a[1].toFixed(1)}" x2="${b[0].toFixed(1)}" y2="${b[1].toFixed(1)}"/>`;}
  const hub=Chart.proj(HUB.lon,HUB.lat,W,H);
  const vectors=list.filter(x=>x.score>=45).map(x=>{
    const p=Chart.proj(x.lon,x.lat,W,H);

    return `<path class="vector" d="M ${p[0].toFixed(1)} ${p[1].toFixed(1)} Q ${mx.toFixed(1)} ${my.toFixed(1)} ${hub[0].toFixed(1)} ${hub[1].toFixed(1)}"
      stroke="${Risk.colour(x.score)}"/>`;
  }).join("");
  const nodes=list.map(x=>{

          <animate attributeName="r" values="9;20;9" dur="3.4s" repeatCount="indefinite"/>
          <animate attributeName="opacity" values=".75;0;.75" dur="3.4s" repeatCount="indefinite"/></circle>
        <text x="${(hub[0]+9).toFixed(1)}" y="${(hub[1]+4).toFixed(1)}" font-size="10.5" fill="var(--brass-lt)" font-weight="600">${LANG==="ar"?"الرياض":"RIYADH"}</text>
      </g>
    </svg>
    <div class="maplegend">
      ${["crit","high","med","low"].map(b=>`<div class="row"><span style="width:9px;height:9px;border-radius:50%;background:var(--sev-${b==="crit"?"crit":b==="high"?"high":b==="med"?"med":"low"})"></span>
        ${esc(t(b==="crit"?"lvl.crit":b==="high"?"lvl.high":b==="med"?"lvl.med":"lvl.low"))}</div>`).join("")}

function viewMatrix(list){
  const cell=(p,i)=>list.filter(x=>x.p===p&&x.i===i);
  const cellColour=(p,i)=>{const s=(p*i)/16*100;return s>=75?"var(--sev-crit-bg)":s>=45?"var(--sev-high-bg)":s>=20?"var(--sev-med-bg)":"var(--sev-low-bg)";};
  let rows="";
  for(let p=4;p>=1;p--){
    rows+=`<div class="axis">${esc(t(p===4?"lvl.vhigh":p===3?"lvl.high":p===2?"lvl.med":"lvl.low"))}</div>`;
    for(let i=1;i<=4;i++){
      const items=cell(p,i);
      rows+=`<div class="cell" style="background:${cellColour(p,i)}">
        <span class="cnt">${items.length}</span>
        ${items.slice(0,4).map(x=>`<button class="bead" data-open="${x.id}" title="${esc(L(x).n)}">${esc(L(x).n)}</button>`).join("")}
        ${items.length>4?`<span style="font-size:10px;color:var(--tx-3)">+${items.length-4}</span>`:""}</div>`;
    }
  }
  return `
  <div class="page-head"><div><h1>${esc(t("nav.matrix"))}</h1>
    <p>${LANG==="ar"?"الاحتمالية (رأسي) × الأثر (أفقي) — الخانة الحرجة أعلى اليمين":"Probability (vertical) × Impact (horizontal) — the critical cell sits top-right"}</p></div>
    <div class="spacer">${filterBar()}</div></div>
  <div class="card"><div class="card-b">
    <div class="matrix">
      ${rows}
      <div class="axis"></div>
      ${[1,2,3,4].map(i=>`<div class="axis">${esc(t("imp."+i))}</div>`).join("")}
    </div>
    <p style="margin-top:12px;font-size:11.5px;color:var(--tx-3)">
      ${LANG==="ar"?"درجة الخطر النهائية تضيف معامل الثقة: الخطر = الاحتمالية × الأثر × (٠٫٥٥ + ٠٫٤٥ × الثقة)."
        :"The final score adds the confidence factor: Risk = Probability × Impact × (0.55 + 0.45 × Confidence)."}</p>
  </div></div>
  <div class="card mt"><div class="card-h"><h3>${esc(t("sec.table"))}</h3></div>${threatTable(list)}</div>`;
}

/* Scenario text is generated from the record's own attributes so it stays
   consistent with the score rather than being hand-written per case. */
function scenarios(x){
  const c=L(x).cty, sect=sectorKeys.slice().sort((a,b)=>x.sec[b]-x.sec[a]).slice(0,2).map(k=>t("sect."+k));
  if(LANG==="ar") return {
    best:`احتواء المؤشرات خلال ${x.vel==="fast"?"أيام":"أسابيع"} دون امتداد خارج ${c}، وبقاء الأثر على ${sect[0]} ضمن الحدود المخطط لها.`,
    likely:`استمرار المستوى الحالي مع تذبذب محدود، وأثر ملموس على ${sect[0]} وأثر جزئي على ${sect[1]}، مع بقاء درجة الخطر قرب ${x.score}.`,
    worst:`تصاعد متسارع يرفع درجة الخطر فوق ${Math.min(99,x.score+14)}، وامتداد الأثر إلى ${sect[1]} وسلاسل الإمداد المرتبطة، مع حاجة إلى تفعيل خطط الطوارئ.`
  };
  return {
    best:`Indicators contained within ${x.vel==="fast"?"days":"weeks"} with no spread beyond ${c}; impact on ${sect[0]} stays inside planned tolerances.`,
    likely:`Current level persists with limited oscillation — material impact on ${sect[0]}, partial impact on ${sect[1]}, and the score holding near ${x.score}.`,
    worst:`Rapid escalation drives the score above ${Math.min(99,x.score+14)}, extending into ${sect[1]} and connected supply chains, and requiring contingency activation.`
  };
}

function simulate(x,sev,dur,resp){
  const dampen=1-(resp/100)*0.45, durF=1+Math.log2(dur)/9;
  return sectorKeys.map(k=>({k,l:t("sect."+k),
    v:Math.max(2,Math.min(100,Math.round(x.sec[k]*(sev/100)*durF*dampen*1.25)))}));
}

/* --- tiny zip reader / writer ---------------------------------------------- */
const Zip={
  CRC:(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;
    for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0;}return t;})(),
  crc32(buf){let c=0xFFFFFFFF;for(let i=0;i<buf.length;i++)c=Zip.CRC[(c^buf[i])&0xFF]^(c>>>8);return (c^0xFFFFFFFF)>>>0;},

  /* Read: returns { "path/in/zip": Uint8Array } */
  async read(buf){
    const dv=new DataView(buf),u8=new Uint8Array(buf);
    let eocd=-1;
    for(let i=u8.length-22;i>=0&&i>u8.length-66000;i--){ if(dv.getUint32(i,true)===0x06054b50){eocd=i;break;} }
    if(eocd<0) throw new Error("not a zip");
    const count=dv.getUint16(eocd+10,true), cdOff=dv.getUint32(eocd+16,true);
    const out={}; let p=cdOff;
    for(let n=0;n<count;n++){
      if(dv.getUint32(p,true)!==0x02014b50) break;
      const method=dv.getUint16(p+10,true), csize=dv.getUint32(p+20,true);
      const nameLen=dv.getUint16(p+28,true), extraLen=dv.getUint16(p+30,true),
            cmtLen=dv.getUint16(p+32,true), lho=dv.getUint32(p+42,true);
      const name=new TextDecoder().decode(u8.subarray(p+46,p+46+nameLen));
      const lNameLen=dv.getUint16(lho+26,true), lExtraLen=dv.getUint16(lho+28,true);
      const dataStart=lho+30+lNameLen+lExtraLen;
      const raw=u8.subarray(dataStart,dataStart+csize);
      out[name]= method===0 ? raw : await Zip.inflate(raw);
      p+=46+nameLen+extraLen+cmtLen;
    }
    return out;
  },
  async inflate(bytes){
    if(typeof DecompressionStream!=="function") throw new Error("no-inflate");
    const ds=new DecompressionStream("deflate-raw");
    const stream=new Blob([bytes]).stream().pipeThrough(ds);
    return new Uint8Array(await new Response(stream).arrayBuffer());
  },

  /* Write: stored (method 0) entries — universally readable, no compressor. */
  write(files){
    const enc=new TextEncoder(), parts=[], central=[]; let offset=0;
    files.forEach(f=>{
      const name=enc.encode(f.name), data=typeof f.data==="string"?enc.encode(f.data):f.data;
      const crc=Zip.crc32(data);
      const lh=new Uint8Array(30+name.length), dv=new DataView(lh.buffer);
      dv.setUint32(0,0x04034b50,true); dv.setUint16(4,20,true); dv.setUint16(6,0x0800,true);
      dv.setUint16(8,0,true); dv.setUint16(10,0,true); dv.setUint16(12,0,true);
      dv.setUint32(14,crc,true); dv.setUint32(18,data.length,true); dv.setUint32(22,data.length,true);
      dv.setUint16(26,name.length,true); dv.setUint16(28,0,true);
      lh.set(name,30);
      parts.push(lh,data);
      const ch=new Uint8Array(46+name.length), cv=new DataView(ch.buffer);
      cv.setUint32(0,0x02014b50,true); cv.setUint16(4,20,true); cv.setUint16(6,20,true);
      cv.setUint16(8,0x0800,true); cv.setUint16(10,0,true);
      cv.setUint32(16,crc,true); cv.setUint32(20,data.length,true); cv.setUint32(24,data.length,true);
      cv.setUint16(28,name.length,true); cv.setUint32(42,offset,true);
      ch.set(name,46); central.push(ch);
      offset+=lh.length+data.length;
    });
    const cdSize=central.reduce((a,b)=>a+b.length,0);
    const eocd=new Uint8Array(22), ev=new DataView(eocd.buffer);
    ev.setUint32(0,0x06054b50,true); ev.setUint16(8,files.length,true); ev.setUint16(10,files.length,true);
    ev.setUint32(12,cdSize,true); ev.setUint32(16,offset,true);
    return new Blob([...parts,...central,eocd],{type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"});
  }
};

/* --- xlsx read / write ------------------------------------------------------ */
const XL={
  xesc:s=>String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c])),
  colIdx(ref){ const m=/^([A-Z]+)/.exec(ref); if(!m) return 0;
    return m[1].split("").reduce((a,ch)=>a*26+(ch.charCodeAt(0)-64),0)-1; },

  async readSheet(arrayBuffer){
    const files=await Zip.read(arrayBuffer);
    const dec=new TextDecoder();
    const parse=x=>new DOMParser().parseFromString(x,"application/xml");
    let shared=[];
    if(files["xl/sharedStrings.xml"]){
      const doc=parse(dec.decode(files["xl/sharedStrings.xml"]));
      shared=[...doc.getElementsByTagName("si")].map(si=>
        [...si.getElementsByTagName("t")].map(t=>t.textContent).join(""));
    }
    const sheetName=Object.keys(files).filter(k=>/^xl\/worksheets\/sheet\d+\.xml$/.test(k)).sort()[0];
    if(!sheetName) throw new Error("no sheet");
    const doc=parse(dec.decode(files[sheetName]));
    const rows=[];
    [...doc.getElementsByTagName("row")].forEach(r=>{
      const arr=[];
      [...r.getElementsByTagName("c")].forEach(c=>{
        const idx=XL.colIdx(c.getAttribute("r")||""), type=c.getAttribute("t");
        let v="";
        if(type==="s"){ const n=c.getElementsByTagName("v")[0]; v=n?(shared[+n.textContent]||""):""; }
        else if(type==="inlineStr"){ v=[...c.getElementsByTagName("t")].map(t=>t.textContent).join(""); }
        else { const n=c.getElementsByTagName("v")[0]; v=n?n.textContent:""; }
        arr[idx]=v;
      });
      rows.push(arr);
    });
    return rows;
  },

  sheetXml(rows){
    const body=rows.map((r,ri)=>`<row r="${ri+1}">`+r.map((v,ci)=>{
      const ref=XL.a1(ci,ri+1);
      if(v===null||v===undefined||v==="") return "";
      return (typeof v==="number")
        ? `<c r="${ref}"><v>${v}</v></c>`
        : `<c r="${ref}" t="inlineStr"><is><t xml:space="preserve">${XL.xesc(v)}</t></is></c>`;
    }).join("")+`</row>`).join("");
    return `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><sheetData>${body}</sheetData></worksheet>`;
  },
  a1(ci,row){ let s="",n=ci+1; while(n>0){const m=(n-1)%26; s=String.fromCharCode(65+m)+s; n=Math.floor((n-1)/26);} return s+row; },

  build(sheets){ /* sheets: [{name, rows}] */
    const ct=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">
<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>
<Default Extension="xml" ContentType="application/xml"/>
<Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>
${sheets.map((s,i)=>`<Override PartName="/xl/worksheets/sheet${i+1}.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>`).join("")}
</Types>`;
    const rels=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">
<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>`;
    const wb=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships">
<sheets>${sheets.map((s,i)=>`<sheet name="${XL.xesc(s.name)}" sheetId="${i+1}" r:id="rId${i+1}"/>`).join("")}</sheets></workbook>`;
    const wbRels=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">
${sheets.map((s,i)=>`<Relationship Id="rId${i+1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet${i+1}.xml"/>`).join("")}</Relationships>`;
    return Zip.write([
      {name:"[Content_Types].xml",data:ct},
      {name:"_rels/.rels",data:rels},
      {name:"xl/workbook.xml",data:wb},
      {name:"xl/_rels/workbook.xml.rels",data:wbRels},
      ...sheets.map((s,i)=>({name:`xl/worksheets/sheet${i+1}.xml`,data:XL.sheetXml(s.rows)}))
    ]);
  }
};

/* --- CSV -------------------------------------------------------------------- */
function parseCSV(text){
  text=text.replace(/^\uFEFF/,"");
  const rows=[]; let row=[],cell="",q=false;
  for(let i=0;i<text.length;i++){
    const ch=text[i];
    if(q){ if(ch==='"'){ if(text[i+1]==='"'){cell+='"';i++;} else q=false; } else cell+=ch; }
    else if(ch==='"') q=true;
    else if(ch===","||ch===";"){ row.push(cell); cell=""; }
    else if(ch==="\n"){ row.push(cell); rows.push(row); row=[]; cell=""; }
    else if(ch!=="\r") cell+=ch;
  }
  if(cell!==""||row.length){ row.push(cell); rows.push(row); }
  return rows.filter(r=>r.some(c=>String(c).trim()!==""));
}

 {k:"effects_en",h:"effects_en",   ar:"التبعات المحتملة (إنجليزي)",vals:{ar:"مفصولة بـ ‎|‎",en:"separated by |"}}
];

const norm=s=>String(s||"").trim().toLowerCase().replace(/[\s_\-()\/:،.]/g,"").replace(/[أإآ]/g,"ا").replace(/ة/g,"ه").replace(/ى/g,"ي");

/* People rename columns. Every reasonable Arabic and English wording for a
   field is accepted, so a sheet written from scratch still imports. */
const SYNONYMS={
 id:["رقم","الرقم","المعرف","كود","الكود","code","ref","المرجع"],
 name_ar:["اسم التهديد","التهديد","الاسم","اسم","العنوان","name","threat","threat name","title","البيان"],

 country_ar:["الدولة","البلد","المنطقة","الدولة أو المنطقة","الموقع","النطاق","country","region","location","area"],
 country_en:["الدولة بالانجليزي","country english","region english"],
 lat:["خط العرض","العرض","دائرة العرض","latitude","lat"],
 lon:["خط الطول","الطول","خط طول","longitude","lng","long"],
 probability:["الاحتمالية","الاحتمال","احتمالية الحدوث","نسبة الاحتمال","probability","likelihood","prob"],
 impact:["الأثر","التأثير","الاثر المتوقع","درجة الأثر","impact","severity of impact","effect"],
 confidence:["الثقة","درجة الثقة","مستوى الثقة","confidence","confidence level"],

 status:["الحالة","حالة التهديد","الوضع","status","state"],
 sources:["المصادر","المصدر","مصدر المعلومة","sources","source","references"],
 updated_minutes:["آخر تحديث","اخر تحديث","التحديث","دقائق","منذ","updated","last update","updated minutes","age"],
 desc_ar:["الوصف","التفاصيل","الشرح","تفاصيل التهديد","description","details","desc","summary"],
 desc_en:["الوصف بالانجليزي","description english","desc english"],
 sec_econ:["الاقتصاد","أثر الاقتصاد","اقتصاد","economy","economic impact"],
 sec_energy:["الطاقة","أثر الطاقة","energy"],
 sec_security:["الأمن","أثر الأمن","security"],
 sec_transport:["النقل","اللوجستيات","النقل واللوجستيات","transport","logistics"],
 sec_health:["الصحة","أثر الصحة","health"],
 sec_invest:["الاستثمار","أثر الاستثمار","investment"],
 sec_vision:["الرؤية","رؤية 2030","رؤية ٢٠٣٠","أثر الرؤية","vision","vision 2030"],
 related_ar:["الجهات","الجهات ذات العلاقة","المعنيون","stakeholders","related","entities"],
 related_en:["الجهات بالانجليزي","stakeholders english"],
 ewi_ar:["مؤشرات الإنذار","مؤشرات الإنذار المبكر","الإنذار المبكر","early warning","warning indicators","ewi"],
 ewi_en:["مؤشرات الإنذار بالانجليزي","early warning english"],
 effects_ar:["التبعات","التبعات المحتملة","الآثار","النتائج","effects","consequences","second order effects"],
 effects_en:["التبعات بالانجليزي","effects english"]
};
const ALIAS={};
FIELDS.forEach(f=>{ ALIAS[norm(f.h)]=f.k; ALIAS[norm(f.ar)]=f.k; ALIAS[norm(f.k)]=f.k; });
Object.keys(SYNONYMS).forEach(k=>SYNONYMS[k].forEach(a=>{ if(!ALIAS[norm(a)]) ALIAS[norm(a)]=k; }));
const pick=(v,map,def)=>{ const n=norm(v); for(const key in map){ if(map[key].some(a=>norm(a)===n)) return key; } return def; };
const splitList=v=>String(v||"").split(/[|\n؛;]+/).map(s=>s.trim()).filter(Boolean);
const inRange=(v,a,b,def)=>{const n=parseFloat(v); return Number.isFinite(n)&&n>=a&&n<=b?n:def;};

function rowToRecord(obj,idx,warn){
  const cat=pick(obj.category,{
    security:["security","امني","امنيه","امنية","الامن"],military:["military","عسكري","عسكريه","عسكرية"],
    cyber:["cyber","سيبراني","سيبرانيه","سيبرانية"],economic:["economic","اقتصادي","اقتصاديه","اقتصادية"],
    environmental:["environmental","بيئي","بيئيه","بيئية"],health:["health","صحي","صحيه","صحية"],
    maritime:["maritime","بحري","بحريه","بحرية"],aerospace:["aerospace","جوي","جويه","فضائي","جويه وفضائيه"]
  },null);
  if(!cat) warn.push({row:idx,msg:LANG==="ar"?`فئة غير معروفة (${obj.category||"فارغة"}) — استُخدمت security`:`Unknown category (${obj.category||"blank"}) — defaulted to security`});
  let c=parseFloat(obj.confidence); if(!Number.isFinite(c)) c=0.6; if(c>1) c=c/100;
  const nAr=String(obj.name_ar||obj.name_en||"").trim();
  const nEn=String(obj.name_en||obj.name_ar||"").trim();
  return {
    id:String(obj.id||"").trim()||("REC-"+String(1000+idx)),
    cat:cat||"security",
    ar:{n:nAr,cty:String(obj.country_ar||obj.country_en||"—").trim(),d:String(obj.desc_ar||obj.desc_en||"").trim()},
    en:{n:nEn,cty:String(obj.country_en||obj.country_ar||"—").trim(),d:String(obj.desc_en||obj.desc_ar||"").trim()},
    lat:parseFloat(obj.lat), lon:parseFloat(obj.lon),
    p:inRange(obj.probability,1,4,2), i:inRange(obj.impact,1,4,2), c,
    hz:pick(obj.horizon,{now:["now","immediate","فوري"],short:["short","قصير","قصيرالمدي","قصيرالمدى"],
        mid:["mid","medium","متوسط","متوسطالمدى"],long:["long","طويل","طويلالمدى"]},"short"),
    vel:pick(obj.velocity,{slow:["slow","بطيء","بطي"],steady:["steady","مطرد","ثابت"],fast:["fast","سريع"]},"steady"),
    tr:pick(obj.trend,{up:["up","rising","تصاعدي","مرتفع","صاعد"],flat:["flat","stable","مستقر","ثابت"],
        down:["down","falling","تنازلي","هابط","متراجع"]},"flat"),
    st:pick(obj.status,{active:["active","نشط"],watch:["watch","monitoring","متابعه","قيدالمتابعه","مراقبه"],
        new:["new","جديد"],contained:["contained","closed","محتوي","مغلق"]},"active"),
    src:splitList(obj.sources),
    upd:parseFloat(obj.updated_minutes),
    sec:{econ:+obj.sec_econ,energy:+obj.sec_energy,security:+obj.sec_security,transport:+obj.sec_transport,
         health:+obj.sec_health,invest:+obj.sec_invest,vision:+obj.sec_vision},
    rel:{ar:splitList(obj.related_ar),en:splitList(obj.related_en)},
    ewi:{ar:splitList(obj.ewi_ar),en:splitList(obj.ewi_en)},
    eff:{ar:splitList(obj.effects_ar),en:splitList(obj.effects_en)}
  };
}

/* Turns a raw grid into records + a human-readable check report. */
function gridToRecords(grid){
  if(!grid.length) throw new Error(t("dt.err.empty"));
  let headRow=-1,mapIdx=null;
  for(let r=0;r<Math.min(8,grid.length);r++){
    const m={},hits=grid[r].filter((cell,ci)=>{const k=ALIAS[norm(cell)]; if(k){m[k]=ci;return true;} return false;}).length;
    if(hits>=3){ headRow=r; mapIdx=m; break; }
  }
  if(headRow<0){
    const seen=(grid[0]||[]).filter(c=>String(c).trim()!=="").slice(0,12).join(" · ");
    throw new Error(t("dt.err.head")+(seen?" — "+t("dt.err.seen")+": "+seen:""));
  }
  if(mapIdx.name_ar===undefined&&mapIdx.name_en===undefined){
    const seen=grid[headRow].filter(c=>String(c).trim()!=="").slice(0,12).join(" · ");
    throw new Error(t("dt.err.name")+" — "+t("dt.err.seen")+": "+seen);
  }
  const warn=[],err=[],out=[];
  for(let r=headRow+1;r<grid.length;r++){
    const raw=grid[r]; if(!raw||!raw.some(c=>String(c).trim()!=="")) continue;
    const obj={}; Object.keys(mapIdx).forEach(k=>obj[k]=raw[mapIdx[k]]!==undefined?raw[mapIdx[k]]:"");
    if(!String(obj.name_ar||obj.name_en||"").trim()){
      err.push({row:r+1,msg:LANG==="ar"?"لا يوجد اسم للتهديد — تم تخطي السطر":"No threat name — row skipped"}); continue;
    }
    const p=parseFloat(obj.probability), i=parseFloat(obj.impact);
    if(!Number.isFinite(p)||p<1||p>4) warn.push({row:r+1,msg:LANG==="ar"?"احتمالية خارج النطاق ‎1–4‎ — استُخدم ‎2":"Probability outside 1–4 — defaulted to 2"});
    if(!Number.isFinite(i)||i<1||i>4) warn.push({row:r+1,msg:LANG==="ar"?"أثر خارج النطاق ‎1–4‎ — استُخدم ‎2":"Impact outside 1–4 — defaulted to 2"});
    out.push(rowToRecord(obj,out.length,warn));
  }
  if(!out.length){
    throw new Error(err.length ? t("dt.err.allrejected").replace("{n}",nf(err.length)) : t("dt.err.empty"));
  }
  return {records:out,warn,err};
}

let lastReport=null;

/* One parser, two callers: the drop zone here and the live file link. */
async function fileToRecords(file){
  let grid;
  if(/\.xlsx$/i.test(file.name)) grid=await XL.readSheet(await file.arrayBuffer());
  else if(/\.(csv|txt)$/i.test(file.name)) grid=parseCSV(await file.text());
  else if(/\.xls$/i.test(file.name)) throw new Error(LANG==="ar"
    ?"صيغة ‎.xls‎ القديمة غير مدعومة — احفظ الملف من إكسل بصيغة ‎.xlsx‎ أو CSV."
    :"The legacy .xls format is not supported — re-save as .xlsx or CSV.");
  else throw new Error(t("dt.err.read"));
  return gridToRecords(grid);
}

function wireData(){
  wireShare(); wireWorkstation();

  const on=v=>{zone.style.borderColor=v?"var(--brass)":"var(--line)";zone.style.background=v?"rgba(201,162,39,.06)":"transparent";};
  ["dragenter","dragover"].forEach(ev=>zone.addEventListener(ev,e=>{e.preventDefault();on(true);}));
  ["dragleave","drop"].forEach(ev=>zone.addEventListener(ev,e=>{e.preventDefault();on(false);}));
  zone.addEventListener("drop",e=>{const f=e.dataTransfer.files[0];if(f)handleFile(f);});
  zone.addEventListener("click",e=>{if(e.target.id!=="btnBrowse")input.click();});
